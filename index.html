/* =====================================================================
   14. ТРЕУГОЛЬНИКИ: геометрия и чертёж
   Точки хранятся по «ролям» A, B, C (вершины) и D (дополнительная точка на стороне
   или на продолжении стороны); на чертеже каждой роли соответствует своя буква.
   Координаты — в системе чертежа 360×360 (y вниз). Всё, что утверждает задача
   (равенство, 90°, середина), проверяется по этим координатам.
   ===================================================================== */
const rad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
const skey = (u, v) => [u, v].sort().join('');                              // 'AB', 'AC', 'BC'
const dirDeg = (V, P) => mod360(toDeg(Math.atan2(V[1] - P[1], P[0] - V[0])));   // направление луча VP, градусы против часовой, y вверх
function angleAt(V, P, Q){
  const a = [P[0] - V[0], P[1] - V[1]], b = [Q[0] - V[0], Q[1] - V[1]];
  return toDeg(Math.acos(clamp((a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1])), -1, 1)));
}
function distToSeg(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2, 0, 1) : 0;
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}
const sidesFromAngles = (a, b, c) => ({AB:100 * Math.sin(rad(c)), AC:100 * Math.sin(rad(b)), BC:100 * Math.sin(rad(a))});   // теорема синусов

/* поставить треугольник: S — длины сторон {AB, AC, BC}; o: {base:'AC', tilt, mirror};
   extraFn(P) может вернуть дополнительные точки (в тех же локальных координатах) */
function placeTri(S, o, extraFn){
  const base = o.base || pick(['AB', 'BC', 'AC']);
  const X = base[0], Y = base[1], Z = ['A', 'B', 'C'].find(r => r !== X && r !== Y);
  const dXY = S[skey(X, Y)], dXZ = S[skey(X, Z)], dYZ = S[skey(Y, Z)];
  const zx = (dXZ * dXZ + dXY * dXY - dYZ * dYZ) / (2 * dXY), zy = -Math.sqrt(Math.max(0, dXZ * dXZ - zx * zx));
  const pts = {}; pts[X] = [0, 0]; pts[Y] = [dXY, 0]; pts[Z] = [zx, zy];
  if(extraFn) Object.assign(pts, extraFn(pts));
  const keys = Object.keys(pts);
  if(o.mirror) keys.forEach(k => { pts[k] = [dXY - pts[k][0], pts[k][1]]; });
  const t = rad(o.tilt || 0), cs = Math.cos(t), sn = Math.sin(t);
  keys.forEach(k => { const q = pts[k]; pts[k] = [q[0] * cs - q[1] * sn, q[0] * sn + q[1] * cs]; });
  const xs = keys.map(k => pts[k][0]), ys = keys.map(k => pts[k][1]);
  const w = Math.max.apply(null, xs) - Math.min.apply(null, xs), h = Math.max.apply(null, ys) - Math.min.apply(null, ys);
  const k = Math.min(250 / w, 205 / h), cx = (Math.max.apply(null, xs) + Math.min.apply(null, xs)) / 2, cy = (Math.max.apply(null, ys) + Math.min.apply(null, ys)) / 2;
  keys.forEach(r => { pts[r] = [180 + (pts[r][0] - cx) * k, 184 + (pts[r][1] - cy) * k]; });
  return pts;
}
/* точка D на стороне UW по условию spec: 'median' | 'bisector' | 'height' | {t} | {angD:θ} | {angV:φ}; V — противоположная вершина */
function cevianPoint(P, V, U, W, spec){
  const Vp = P[V], Up = P[U], Wp = P[W];
  if(spec === 'median') return lerp(Up, Wp, .5);
  if(spec === 'bisector') return lerp(Up, Wp, dist(Vp, Up) / (dist(Vp, Up) + dist(Vp, Wp)));
  if(spec === 'height'){ const dx = Wp[0] - Up[0], dy = Wp[1] - Up[1]; return lerp(Up, Wp, ((Vp[0] - Up[0]) * dx + (Vp[1] - Up[1]) * dy) / (dx * dx + dy * dy)); }
  if(spec.t !== undefined) return lerp(Up, Wp, spec.t);
  // численно: угол ∠UDV = θ (убывает от U к W) или ∠UVD = φ (растёт от U к W)
  let lo = 0.001, hi = 0.999;
  const f = t => spec.angD !== undefined ? angleAt(lerp(Up, Wp, t), Up, Vp) - spec.angD : spec.angV - angleAt(Vp, Up, lerp(Up, Wp, t));
  const incr = f(hi) > f(lo);
  for(let i = 0; i < 60; i++){ const m = (lo + hi) / 2; if((f(m) > 0) === incr) hi = m; else lo = m; }
  return lerp(Up, Wp, (lo + hi) / 2);
}
/* Собрать чертёж. o:
   angles {A,B,C} или sides {AB,AC,BC}; base, tilt, mirror;
   cevian {from:'A', spec}  — точка D на противоположной стороне, проведён отрезок from–D;
   ext {at:'C', from:'B'}   — D на продолжении стороны from–at за вершину at (внешний угол) */
function makeTriFig(o){
  const S = o.sides || sidesFromAngles(o.angles.A, o.angles.B, o.angles.C);
  const extra = P => {
    if(o.cevian){ const V = o.cevian.from, rest = ['A', 'B', 'C'].filter(r => r !== V); return {D:cevianPoint(P, V, rest[0], rest[1], o.cevian.spec)}; }
    if(o.ext){ const a = P[o.ext.from], b = P[o.ext.at], len = 0.45 * dist(a, b); const u = [(b[0] - a[0]) / dist(a, b), (b[1] - a[1]) / dist(a, b)]; return {D:[b[0] + u[0] * len, b[1] + u[1] * len]}; }
    return {};
  };
  const P0 = placeTri(S, o, extra);
  const roles = ['A', 'B', 'C'].concat(P0.D ? ['D'] : []);
  const lets = shuffle(LETTERS).slice(0, roles.length), L = {};
  roles.forEach((r, i) => { L[r] = lets[i]; });

  if(o.cevian) segs.push([o.cevian.from, 'D']);
  if(o.ext) segs.push([o.ext.at, 'D']);
  const P = {}; roles.forEach(r => { P[r] = P0[r]; });
  const fig = {kind:'tri', P, L, roles, segs, cev:o.cevian ? o.cevian.from : null, ext:o.ext || null};
  fig.ang = {A:angleAt(P.A, P.B, P.C), B:angleAt(P.B, P.A, P.C), C:angleAt(P.C, P.A, P.B)};
  fig.len = {AB:dist(P.A, P.B), AC:dist(P.A, P.C), BC:dist(P.B, P.C)};
  return fig;
}
const triCentroid = fig => [(fig.P.A[0] + fig.P.B[0] + fig.P.C[0]) / 3, (fig.P.A[1] + fig.P.B[1] + fig.P.C[1]) / 3];

/* ---------- какие отрезки, лучи и углы есть на чертеже ---------- */
function covered(fig, u, v){                  // отрезок uv целиком лежит на нарисованных отрезках?
  for(let i = 0; i <= 24; i++){
    const q = lerp(fig.P[u], fig.P[v], i / 24);
    if(!fig.segs.some(s => distToSeg(q, fig.P[s[0]], fig.P[s[1]]) < 0.7)) return false;
  }

}
function segList(fig){                        // все пары точек, соединённые нарисованным путём
  const out = [];
  for(let i = 0; i < fig.roles.length; i++) for(let j = i + 1; j < fig.roles.length; j++){
    const u = fig.roles[i], v = fig.roles[j];
    if(covered(fig, u, v)) out.push({a:u, b:v, id:skey(u, v), len:dist(fig.P[u], fig.P[v])});
  }
  return out;
}
function rayClasses(fig, v){                  // лучи из вершины v: точки на одном луче объединены
  const pts = fig.roles.filter(r => r !== v && covered(fig, v, r)).map(r => ({r, dir:dirDeg(fig.P[v], fig.P[r]), d:dist(fig.P[v], fig.P[r])}));
  const cls = [];
  pts.forEach(p => {
    const c = cls.find(x => Math.abs(mod360(x.dir - p.dir + 180) - 180) < 0.2);
    if(c){ c.roles.push(p.r); if(p.d > c.d){ c.d = p.d; c.far = p.r; } } else cls.push({dir:p.dir, roles:[p.r], d:p.d, far:p.r});
  });
  cls.forEach(c => c.roles.sort());

}
/* все углы чертежа (меньше развёрнутого): {v, c1, c2, size, id} */
function angList(fig){
  const out = [];
  fig.roles.forEach(v => {
    const cl = rayClasses(fig, v);
    for(let i = 0; i < cl.length; i++) for(let j = i + 1; j < cl.length; j++){
      const size = angleAt(fig.P[v], fig.P[cl[i].far], fig.P[cl[j].far]);
      if(size > 0.5 && size < 179.5) out.push({v, c1:cl[i], c2:cl[j], size, id:v + ':' + [cl[i].roles[0], cl[j].roles[0]].sort().join('')});
    }
  });

}
function wedgeParams(a){                      // от какого направления и на сколько градусов идёт угол (против часовой)
  const d1 = a.c1.dir, d2 = a.c2.dir;
  return mod360(d2 - d1) <= 180 ? {start:d1, size:a.size} : {start:d2, size:a.size};
}
const angR = (fig, a) => clamp(0.42 * Math.min(a.c1.d, a.c2.d), 26, 72);                       // радиус сектора для нажатия
const angHas = (a, dirv) => { const w = wedgeParams(a); return mod360(dirv - w.start) <= w.size + 0.3; };
function angNested(list, a){ return list.filter(b => b !== a && b.v === a.v && angHas(a, b.c1.dir) && angHas(a, b.c2.dir) && b.size < a.size - 0.5).length; }
/* все записи угла: ∠ + буква на одном луче + вершина + буква на другом (и в обратном порядке) */
function angNotations(fig, a){
  const out = [];
  a.c1.roles.forEach(p => a.c2.roles.forEach(q => { out.push('∠' + fig.L[p] + fig.L[a.v] + fig.L[q]); out.push('∠' + fig.L[q] + fig.L[a.v] + fig.L[p]); }));

}
const angById = (fig, id) => angList(fig).find(a => a.id === id);
/* расшифровать запись из трёх букв: {v, p, q, kind:'angle'|'degenerate'}; буквы → роли */
function roleOfLetter(fig, ch){ return fig.roles.find(r => fig.L[r] === ch); }
function denoteAngle(fig, text){
  const m = /^∠(.)(.)(.)$/.exec(text); if(!m) return null;
  const p = roleOfLetter(fig, m[1]), v = roleOfLetter(fig, m[2]), q = roleOfLetter(fig, m[3]);
  if(!p || !v || !q || p === v || q === v || p === q) return null;
  if(!covered(fig, v, p) || !covered(fig, v, q)) return null;
  const size = angleAt(fig.P[v], fig.P[p], fig.P[q]);
  if(size < 0.5 || size > 179.5) return {kind:'degenerate', v, p, q};
  const cl = rayClasses(fig, v), cp = cl.find(c => c.roles.includes(p)), cq = cl.find(c => c.roles.includes(q));

}
function triList(fig){                        // все треугольники чертежа (тройки точек не на одной прямой)
  const out = [], r = fig.roles;
  for(let i = 0; i < r.length; i++) for(let j = i + 1; j < r.length; j++) for(let k = j + 1; k < r.length; k++){
    const a = r[i], b = r[j], c = r[k];
    if(covered(fig, a, b) && covered(fig, b, c) && covered(fig, a, c) && angleAt(fig.P[a], fig.P[b], fig.P[c]) > 0.5 && angleAt(fig.P[a], fig.P[b], fig.P[c]) < 179.5)
      out.push({pts:[a, b, c], id:[a, b, c].sort().join('')});
  }
  return out;
}
const collinearTriples = fig => {
  const out = [], r = fig.roles;
  for(let i = 0; i < r.length; i++) for(let j = i + 1; j < r.length; j++) for(let k = j + 1; k < r.length; k++){
    const s = angleAt(fig.P[r[i]], fig.P[r[j]], fig.P[r[k]]);          // три точки на одной прямой: угол при любой из них 0° или 180°
    if(s < 0.5 || s > 179.5) out.push([r[i], r[j], r[k]]);
  }
  return out;
};

/* ---------- нажатия на чертёж ---------- */
const triTapAngles = (fig, x, y) => {              // углы, в чей сектор попало нажатие, от меньшего к большему
  const list = angList(fig), q = [x, y];
  // сначала угол, чья вершина ближе к месту нажатия (иначе область далёкого угла перехватывает нажатие), у вложенных углов с общей вершиной — меньший
  return list.filter(a => { const V = fig.P[a.v]; return dist(q, V) <= angR(fig, a) && angHas(a, dirDeg(V, q)); })
    .sort((p, r) => (dist(q, fig.P[p.v]) - dist(q, fig.P[r.v])) || (p.size - r.size));
};
const triTapSegs = (fig, x, y, tol) => segList(fig).filter(s => distToSeg([x, y], fig.P[s.a], fig.P[s.b]) <= (tol || 14)).sort((p, r) => p.len - r.len);
const triTapVertex = (fig, x, y) => {              // для режима 8: ближайшая вершина, внутри угла которой нажали
  const q = [x, y];
  const c = ['A', 'B', 'C'].filter(v => { const V = fig.P[v], o = ['A', 'B', 'C'].filter(r => r !== v); return dist(q, V) <= 118 && angleAt(V, fig.P[o[0]], q) + angleAt(V, q, fig.P[o[1]]) < angleAt(V, fig.P[o[0]], fig.P[o[1]]) + 0.6; });
  return c.sort((a, b) => dist(q, fig.P[a]) - dist(q, fig.P[b]))[0] || null;
};

/* ---------- рисование ---------- */
const wedgeAt = (cx, cy, a0, size, r) => { const t0 = rad(a0), t1 = rad(a0 + size); return `M${f1(cx)} ${f1(cy)}L${f1(cx + r * Math.cos(t0))} ${f1(cy - r * Math.sin(t0))}A${r} ${r} 0 ${size > 180 ? 1 : 0} 0 ${f1(cx + r * Math.cos(t1))} ${f1(cy - r * Math.sin(t1))}Z`; };
const arcAt = (cx, cy, a0, size, r) => { const t0 = rad(a0), t1 = rad(a0 + size); return `M${f1(cx + r * Math.cos(t0))} ${f1(cy - r * Math.sin(t0))}A${r} ${r} 0 ${size > 180 ? 1 : 0} 0 ${f1(cx + r * Math.cos(t1))} ${f1(cy - r * Math.sin(t1))}`; };

/* угол по вершине и двум лучам: найти в angList (поддерживает записи с разными буквами на одном луче) */
function angOf(fig, v, p, q){ const d = denoteAngle(fig, '∠' + fig.L[p] + fig.L[v] + fig.L[q]); return d && d.kind === 'angle' ? angById(fig, d.id) : null; }
function angLabelPos(fig, a){
  const V = fig.P[a.v], w = wedgeParams(a), r = Math.min(clamp(28 / (2 * sinHalf(a.size)) + 24, 48, 98), 0.66 * Math.min(a.c1.d, a.c2.d));

/* o.fills: [{kind:'tri', pts, pat} | {kind:'ang', ang, pat}]; o.sideEm: [[u,v]]; o.ptEm: [роли]; o.ticks: [{a,b,n}];

function gen6(){

    if(withCev) o.cevian = {from:pick(['A', 'B', 'C']), spec:{t:0.3 + rnd() * 0.4}};

        chk('условие содержит x и y (в см)', cm[0] === m.x && cm[1] === m.y, cm + '');
        chk('x не может быть боковой стороной (x + x ≤ y), а y — может (y + y > x, x + y > y)', m.x + m.x <= m.y && m.y + m.y > m.x && m.x + m.y > m.y);
        chk('ответ = 2y + x', t.answer === 2 * m.y + m.x && t.answer === m.P);
        chk('задача помечена «рисунок не в масштабе»', t.banner.length > 0 && t.scale);
      }
    }
    chk('чертёж задачи рисуется с подписями и «?» для искомой величины', (() => { const k0 = {}; (t.known0 || []).forEach(k => { k0[k.sec] = k.v; }); const html = t.paint(k0, {fills:t.steps[0].angles}); return /<svg/.test(html) && (t.target === null || t.target === undefined || />\?</.test(html)); })());
    chk('в условии есть минимум одно число', nums.length > 0 || /\d/.test(plainText(t.cond)));
  }

  const per = Math.floor(N / 5), counts = {};
  const runs = [[6, gen6, check6], [7, gen7, check7], [8, gen8, check8], [9, gen9, check9], [10, gen10, check9]];
  try{
    runs.forEach(([mode, gen, check]) => {
      for(let i = 0; i < per; i++){
        ctx = `режим ${mode}`;
        let t; try{ t = gen(); }catch(e){ chk('генератор не падает', false, e.message); continue; }
        if(!t){ chk('генератор всегда возвращает задачу', false); continue; }
        ctx = `режим ${mode}, ${t.type}`;
        counts[mode] = (counts[mode] || 0) + 1; R.total++; R.tasks[t.type] = (R.tasks[t.type] || 0) + 1;
        let svg = ''; try{ svg = drawTri(t.fig, {}); }catch(e){ chk('чертёж рисуется', false, e.message); continue; }
        checkFig(t.fig, svg);
        try{ check(t); }catch(e){ chk('проверка задачи не падает', false, e.stack.split('\n').slice(0, 2).join(' | ')); }
      }
    });
  }finally{ _rng = prev; }
  R.counts = counts;
  R.checkCount = Object.keys(R.checks).reduce((a, k) => a + R.checks[k].ok + R.checks[k].bad, 0);
  R.bad = Object.keys(R.checks).reduce((a, k) => a + R.checks[k].bad, 0);
  return R;
}

/* ---------- режим 6: «Найди элемент» ---------- */
function mount6(t, stage){
  const fig = t.fig, gate = {}, isFind = t.variant === 'find', tg = t.target, L = r => fig.L[r];

  const host = $('#boardHost');
  let locked = false;
  const hl = () => t.kind === 'angle' ? {fills:[{kind:'ang', ang:tg, pat:'a'}]} : t.kind === 'side' ? {sideHl:[[tg.a, tg.b]]} : {fills:[{kind:'tri', pts:tg.pts, pat:'a'}]};
  const em = () => t.kind === 'angle' ? {sideEm:sideEmOf(fig, tg)} : t.kind === 'side' ? {ptEm:[tg.a, tg.b]} : {sideEm:[[tg.pts[0], tg.pts[1]], [tg.pts[1], tg.pts[2]], [tg.pts[0], tg.pts[2]]]};
  const okMark = () => t.kind === 'angle' ? {fills:[{kind:'ang', ang:tg, pat:'ok'}]} : t.kind === 'side' ? {sideHl:[[tg.a, tg.b]]} : {fills:[{kind:'tri', pts:tg.pts, pat:'ok'}]};
  const paint = o => {
    host.innerHTML = triSvg(fig, Object.assign({attrs:isFind && !locked ? 'class="tap"' : '', cues:t.kind === 'angle'}, isFind ? {} : hl(), o));
    if(isFind && !locked) $('svg', host).addEventListener('click', onTap);
  };
  const okWhy = t.kind === 'angle' ? `${nm(t.text)}: вершина ${L(tg.v)} — средняя буква, стороны — ${arms}.`
    : t.kind === 'side' ? `Отрезок ${nm(t.text)} соединяет точки ${t.text[0]} и ${t.text[1]}.` : `${nm(t.text)}: три вершины — ${t.text.slice(1).split('').join(', ')}.`;
  const tip = () => toast(t.kind === 'angle' ? 'Нажми внутри угла, рядом с его вершиной' : 'Нажми прямо на линию отрезка', 2200);
  function onTap(e){
    if(locked) return;
    const xy = svgXY(e.currentTarget, e);
    if(t.kind === 'angle'){
      const hit = triTapAngles(fig, xy[0], xy[1]); if(!hit.length){ tip(); return; }
      if(hit.some(a => a.id === tg.id)){ judge(gate, true); locked = true; paint(Object.assign({}, okMark(), {marks:[]})); finishTask(okWhy); return; }
      const b = hit[0], bn = nm(pick(angNotations(fig, b))), same = b.v === tg.v;
      const lead = same ? `Ты показал ${bn}: у него та же вершина, но другие стороны.` : `Ты показал ${bn} — это угол при другой вершине.`;
      const r = judge(gate, false, {trap:same ? 'neighbor' : 'wrongVertex',
        hint:`<p>${lead}</p><p>У угла ${nm(t.text)} вершина — средняя буква ${L(tg.v)}, а стороны — ${arms}. Они подсвечены.</p>`,
        reveal:`<p>${lead}</p><p>Нужный угол ${nm(t.text)} — вот он: вершина ${L(tg.v)} посередине, стороны — ${arms}.</p>`});
      if(r === 'hint') paint(Object.assign({fills:[{kind:'ang', ang:b, pat:'bad'}]}, em()));
      else{ locked = true; paint(Object.assign({}, okMark(), em())); finishTask(null); }
    }else{
      const hit = triTapSegs(fig, xy[0], xy[1]); if(!hit.length){ tip(); return; }
      if(hit.some(s => s.id === tg.id)){ judge(gate, true); locked = true; paint(okMark()); finishTask(okWhy); return; }
      const b = hit[0], bn = nm(L(b.a) + L(b.b)), sh = [b.a, b.b].filter(r => r === tg.a || r === tg.b);
      let trap = 'wrongSegment', lead = `Ты показал отрезок ${bn}.`;
      if(sh.length === 1){
        const ang = angleAt(fig.P[sh[0]], fig.P[b.a === sh[0] ? b.b : b.a], fig.P[tg.a === sh[0] ? tg.b : tg.a]);
        if(ang < 0.5 || ang > 179.5){ trap = 'segPart'; lead += ' Он лежит на одной прямой с нужным, но это другой отрезок (часть или вся сторона).'; }
        else{ trap = 'segNeighbor'; lead += ' У него общий конец с нужным, но второй конец другой.'; }
      }
      const r = judge(gate, false, {trap, hint:`<p>${lead}</p><p>Нужен отрезок ${nm(t.text)}: он соединяет точки ${t.text[0]} и ${t.text[1]} (подсвечены).</p>`,
        reveal:`<p>${lead}</p><p>Нужный отрезок ${nm(t.text)} — вот он: он соединяет точки ${t.text[0]} и ${t.text[1]}.</p>`});
      if(r === 'hint') paint(Object.assign({sideHl:[[b.a, b.b]]}, em()));
      else{ locked = true; paint(Object.assign({}, okMark(), em())); finishTask(null); }
    }
  }
  if(isFind){ paint({}); return; }
  paint({});
  $('#ans').innerHTML = `<div class="opts two">${t.opts.list.map((o, i) => `<button class="btn math" data-i="${i}" type="button" aria-label="${esc(o.text)}">${mt(o.text)}</button>`).join('')}</div>`;
  const hints = {
    vertexMid:`В записи угла вершина стоит посередине. Вершина выделенного угла — точка ${t.kind === 'angle' ? L(tg.v) : ''}, значит, эта буква должна быть средней.`,
    neighbor:t.kind === 'angle' ? 'Это запись соседнего угла: другая пара сторон. Подсвечены стороны выделенного угла — прочитай буквы на их концах.' : 'Это отрезок с общим концом, но другой второй точкой. Выделенный отрезок соединяет подсвеченные точки.',
    wider:t.kind === 'angle' ? 'В эту запись попал лишний кусок: она охватывает больший угол. У выделенного угла только две стороны — они подсвечены.' : 'Эта запись — вся сторона, а выделена только её часть. Прочитай буквы подсвеченных точек.',
    part:t.kind === 'angle' ? 'Это только часть выделенного угла. Выделенный угол ограничен подсвеченными сторонами.' : 'Эта запись — только часть выделенного отрезка. Прочитай буквы подсвеченных точек.',
    other:t.kind === 'angle' ? 'Это другой угол чертежа. Найди вершину и стороны выделенного угла — они подсвечены.' : 'Это другой отрезок чертежа. Выделенный отрезок соединяет подсвеченные точки.',
    triOther:'Это другой треугольник. У выделенного три вершины — стороны подсвечены.'
  };
  $$('#ans .btn').forEach(b => b.addEventListener('click', () => {
    if(locked) return;
    const o = t.opts.list[+b.dataset.i], ok = o.kind === 'ok', btns = $$('#ans .btn');
    const hint = o.kind === 'triDegenerate' ? `Точки ${o.text.slice(1).split('').join(', ')} лежат на одной прямой — из них нельзя составить треугольник.` : hints[o.kind];
    const good = t.opts.list[t.opts.correct].text;
    const r = judge(gate, ok, {trap:o.kind, hint:`<p>${hint}</p>`, reveal:`<p>Правильная запись: ${nm(good)}. ${okWhy}</p>`});
    if(r === 'right'){ locked = true; b.classList.add('good'); btns.forEach(x => x.disabled = true); paint(okMark()); finishTask(okWhy); }
    else if(r === 'hint'){ b.classList.add('bad'); b.disabled = true; paint(em()); }
    else{ locked = true; b.classList.add('bad'); btns.forEach((x, i) => { x.disabled = true; if(i === t.opts.correct) x.classList.add('good'); }); paint(Object.assign({}, okMark(), em())); finishTask(null); }
  }));
}

/* ---------- режим 8: «Перенеси условие на рисунок» ---------- */
function mount8vals(t, stage){
  const fig = t.fig, gate = {};
  let placed = {}, armed = null, sel = null, hover = null, locked = false;
  stage.innerHTML = `<p class="task">Перенеси условие на чертёж: впиши числа в нужные углы.</p>
    <p class="lead">Считать ничего не нужно: пойми, какому углу принадлежит число и какие ещё углы ему равны.</p>
    <div class="inset"><span class="px" style="font-size:10px">УСЛОВИЕ</span><div class="task" style="margin:6px 0 0">${t.text}</div></div>
    <div id="boardHost"></div>
    <div class="steplab">ФИШКИ: НАЖМИ НА ФИШКУ И НА УГОЛ ИЛИ ПЕРЕТАЩИ</div><div class="tray" id="tray"></div>
    <div id="manual"></div>
    <div class="row" style="margin:12px 3px 0"><button class="btn big grow" id="bCheck" type="button">ПРОВЕРИТЬ</button><button class="btn" id="bClear" type="button">ОЧИСТИТЬ</button></div>
    <div id="fb"></div><div id="nextbar"></div>`;
  const host = $('#boardHost');
  const paint = o => {
    o = o || {};
    const fills = [];
    if(sel) fills.push({kind:'ang', ang:tVAng(fig, sel), pat:'sel'});
    if(hover && hover !== sel) fills.push({kind:'ang', ang:tVAng(fig, hover), pat:'sel'});
    (o.fills || []).forEach(f => fills.push(f));
    const angLabels = ['A', 'B', 'C'].map(r => ({ang:tVAng(fig, r), text:placed[r] !== undefined ? placed[r] + '°' : '', fill:(o.cell && o.cell[r]) || '#ffffff'}));
    host.innerHTML = triSvg(fig, {attrs:locked ? '' : 'class="tap"', fills, sideEm:o.sideEm, ptEm:o.ptEm, angLabels});
    if(!locked) $('svg', host).addEventListener('click', onBoard);
  };
  const vertexFromClient = ev => {
    const svg = $('svg', host), r = svg.getBoundingClientRect();
    if(ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return null;
    return triTapVertex(fig, (ev.clientX - r.left) * 360 / r.width, (ev.clientY - r.top) * 360 / r.height);
  };
  const renderTray = () => {
    $('#tray').innerHTML = t.chips.map(v => `<button class="chip${armed === v ? ' arm' : ''}" data-v="${v}" type="button" aria-pressed="${armed === v}">${v}°</button>`).join('');
    $$('#tray .chip').forEach(ch => {
      const v = +ch.dataset.v;
      ch.addEventListener('click', ev => { if(ev.detail === 0 && !locked){ armed = armed === v ? null : v; renderTray(); } });
      ch.addEventListener('pointerdown', e => {
        if(locked) return;
        e.preventDefault();
        let moved = false, ghost = null; const x0 = e.clientX, y0 = e.clientY;
        const move = ev => {
          if(!moved && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8){ moved = true; ghost = ch.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); }
          if(moved){ ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; const i = vertexFromClient(ev); if(i !== hover){ hover = i; paint(); } }
        };
        const up = ev => {
          document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
          if(ghost) ghost.remove();
          if(moved){ const i = vertexFromClient(ev); hover = null; if(i) put(i, v); else paint(); }
          else { armed = armed === v ? null : v; renderTray(); }
        };
        document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
      });
    });
  };
  const showManual = () => {
    const m = $('#manual');
    if(!sel){ m.innerHTML = ''; return; }
    m.innerHTML = `<div class="qtext">Угол ${t.nameH[sel]} — впиши число:</div>

      <button class="btn" id="bPut" type="button">ВПИСАТЬ</button><button class="btn" id="bErase" type="button">СТЕРЕТЬ</button></div>`;
    const inp = $('#mval'); if(placed[sel] !== undefined) inp.value = placed[sel];
    const doPut = () => { const v = parseInt(inp.value, 10); if(!isNaN(v) && v > 0 && v < 181){ placed[sel] = v; sel = null; paint(); showManual(); } };
    $('#bPut').addEventListener('click', doPut);
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') doPut(); });
    $('#bErase').addEventListener('click', () => { delete placed[sel]; sel = null; paint(); showManual(); });
  };
  function put(r, v){ placed[r] = v; sel = null; hover = null; paint(); showManual(); }
  function onBoard(e){
    if(locked) return;

    if(armed !== null) put(r, armed);
    else { sel = sel === r ? null : r; paint(); showManual(); }
  }
  renderTray(); paint();
  const eqSides = t.X ? [[t.X, tOther(t.X)[0]], [t.X, tOther(t.X)[1]]] : [];
  const hint8 = iss => {
    const nmI = t.nameH[iss.r], A = tVAng(fig, iss.r);
    if(iss.kind === 'wrong') return {trap:'wrongPlace', html:`<p>В угол ${nmI} поставлено ${iss.got}°, но по условию там другое число.</p><p>Угол ${nmI} лежит при вершине ${tL(fig, iss.r)}. Проверь, какому углу относится каждое число.</p>`, fills:[{kind:'ang', ang:A, pat:'bad'}], em:{}};
    if(iss.kind === 'isoApex') return {trap:'isoApex', html:`<p>Число ${iss.got}° стоит в угле ${nmI}, но по условию оно относится к другому углу.</p><p>Углы при основании равны между собой, но сколько в них градусов, придётся считать. Считать мы пока не будем — оставь их пустыми.</p>`, fills:[{kind:'ang', ang:A, pat:'bad'}], em:{sideEm:eqSides}};
    if(iss.kind === 'extra') return {trap:'extraNum', html:`<p>Для угла ${nmI} числа в условии нет, и равным известному он не является.</p><p>Оставь его пустым: считать мы пока не будем.</p>`, fills:[{kind:'ang', ang:A, pat:'bad'}], em:{}};
    if(iss.kind === 'missGiven') return {trap:'missGiven', html:`<p>Не все числа из условия перенесены на чертёж.</p><p>Проверь: по условию ${nmI} = ${t.expected[iss.r]}°. Это угол при вершине ${tL(fig, iss.r)}.</p>`, fills:[{kind:'ang', ang:A, pat:'a'}], em:{ptEm:[iss.r]}};
    return {trap:'isoMissEq', html:`<p>Есть ещё угол, значение которого уже известно, считать не нужно.</p><p>По условию две стороны равны (подсвечены): значит, это равнобедренный треугольник, а углы при его основании равны.</p>`, fills:[{kind:'ang', ang:A, pat:'b'}], em:{sideEm:eqSides}};
  };
  const reveal8 = () => {
    const g = t.given.map(r => `<li>${t.nameH[r]} = ${t.an[r]}° — по условию.</li>`).join('');
    const eq = t.form === 'isoBase' ? `<li>Равные стороны — боковые, значит, углы при основании равны: ${t.nameH[tOther(t.X)[1]]} тоже ${t.an[tOther(t.X)[0]]}°.</li>` : '';
    return `<p>Вот как надо:</p><ul style="margin:0;padding-left:20px">${g}${eq}</ul><p>Остальные углы придётся считать: сейчас они остаются пустыми.</p>`;
  };

    if(locked) return;

    if(!first && Object.keys(placed).length === 0){ setFb('<p>Сначала впиши числа из условия в углы на чертеже.</p>', 'hint'); return; }
    const hint = first ? hint8(first) : null;
    const green = () => Object.fromEntries(Object.keys(placed).map(k => [k, '#c8f5b0']));
    const r = judge(gate, !first, {trap:hint && hint.trap, hint:hint && hint.html, reveal:reveal8()});
    if(r === 'right'){ locked = true; sel = null; armed = null; renderTray(); paint({cell:green()}); $('#manual').innerHTML = ''; finishTask(t.form === 'isoBase' ? 'Всё верно: число стоит в своём угле, а второй угол при основании равнобедренного ему равен.' : 'Всё верно: числа из условия стоят в своих углах, лишнего нет.'); }
    else if(r === 'hint') paint({fills:hint.fills, sideEm:hint.em.sideEm, ptEm:hint.em.ptEm});
    else{ locked = true; sel = null; armed = null; renderTray(); placed = Object.assign({}, t.expected); paint({cell:green()}); $('#manual').innerHTML = ''; finishTask(null); }
  });
}

function mount8pair(t, stage){
  const fig = t.fig, g1 = {}, g2 = {}, pk = t.picks, L = r => fig.L[r];
  let sel = [], phase = 1, locked = false;
  stage.innerHTML = `<p class="task">Перенеси условие на чертёж: найди то, что в нём названо.</p>
    <div class="inset"><span class="px" style="font-size:10px">УСЛОВИЕ</span><div class="task" style="margin:6px 0 0">${t.text}</div></div>
    <p class="lead" id="q1">${pk.type === 'side' ? 'Нажми на отрезки, о которых говорится в условии (по одному), затем на «ПРОВЕРИТЬ».' : pk.any ? 'Нажми на один из углов, о которых говорится в условии, затем на «ПРОВЕРИТЬ».' : 'Нажми на углы, о которых говорится в условии (по одному), затем на «ПРОВЕРИТЬ».'}</p>
    <div id="boardHost"></div><div id="q2"></div>
    <div class="row" style="margin:12px 3px 0" id="chkRow"><button class="btn big grow" id="bCheck" type="button">ПРОВЕРИТЬ</button></div>
    <div id="fb"></div><div id="nextbar"></div>`;
  const host = $('#boardHost');
  const selFills = () => pk.type === 'ang' ? sel.map(id => ({kind:'ang', ang:angById(fig, id), pat:'sel'})) : [];
  const selSides = () => pk.type === 'side' ? sel.map(id => { const s = segList(fig).find(z => z.id === id); return [s.a, s.b]; }) : [];
  const goodFills = () => pk.type === 'ang' ? pk.items.map((id, i) => ({kind:'ang', ang:angById(fig, id), pat:i ? 'b' : 'a'})) : [];
  const goodSides = () => pk.type === 'side' ? pk.items.map(id => { const s = segList(fig).find(z => z.id === id); return [s.a, s.b]; }) : [];
  const paint = o => {
    o = o || {};
    host.innerHTML = triSvg(fig, {attrs:phase === 1 && !locked ? 'class="tap"' : '', fills:phase === 1 ? selFills() : goodFills(), sideHl:phase === 1 ? selSides() : goodSides(), sideEm:o.sideEm, ptEm:o.ptEm, cues:pk.type === 'ang'});
    if(phase === 1 && !locked) $('svg', host).addEventListener('click', onTap);
  };
  function onTap(e){
    const xy = svgXY(e.currentTarget, e);
    const hit = pk.type === 'side' ? triTapSegs(fig, xy[0], xy[1]) : triTapAngles(fig, xy[0], xy[1]);
    if(!hit.length) return;
    const id = hit[0].id;
    sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat([id]); paint();
  }
  paint();
  const V = t.V, U = t.U, W = t.W, VD = t.sub === 'iso' ? '' : nm(L(V) + L('D')), UW = t.sub === 'iso' ? '' : nm(L(U) + L(W));
  const em1 = {
    med:{sideEm:[], ptEm:['D']}, bis:{sideEm:[[V, U], [V, 'D'], [V, W]], ptEm:[]}, hei:{sideEm:[], ptEm:['D']}, iso:{sideEm:[], ptEm:[t.X].concat(tOther(t.X))}
  }[t.sub];
  const h1 = {
    med:`Медиана ${VD} делит сторону ${UW} пополам. Выбери два равных отрезка, на которые она разбила сторону.`,
    bis:`Биссектриса ${VD} делит угол ${nm('∠' + L(U) + L(V) + L(W))} на два равных угла. Выбери эти два угла.`,
    hei:`Высота ${VD} перпендикулярна стороне ${UW}. Выбери один из углов при точке D: он прямой.`,
    iso:`В условии названы две стороны: ${t.text}. Найди их на чертеже по буквам и выбери обе.`
  }[t.sub];
  const need = pk.any ? 1 : pk.items.length;
  $('#bCheck').addEventListener('click', () => {
    if(locked || phase !== 1) return;
    const ok = pk.any ? sel.length === 1 && pk.items.includes(sel[0]) : sel.length === need && pk.items.every(id => sel.includes(id));
    const r = judge(g1, ok, {trap:'pickWrong', hint:`<p>${sel.length !== need ? `Нужно выбрать ${need === 1 ? 'один элемент' : 'два элемента'}. ` : ''}${h1}</p>`, reveal:`<p>${h1}</p><p>Вот они на чертеже.</p>`, onHint:null});
    if(r === 'hint') paint(em1);
    else{ phase = 2; sel = []; paint(); startPhase2(r === 'shown'); }
  });
  function startPhase2(wasShown){
    $('#chkRow').innerHTML = '';
    $('#q1').innerHTML = t.ask;
    if(!wasShown) setFb('<p>Элементы найдены верно.</p>', 'ok');
    $('#q2').innerHTML = `<div class="opts">${t.opts.map(o => `<button class="btn block math" data-id="${o.id}" type="button">${mt(o.text)}</button>`).join('')}</div>`;
    const h2 = {
      med:'Медиана — про середину стороны. Какое равенство говорит о том, что точка делит сторону пополам?',
      bis:'Биссектриса — про углы. Какое равенство говорит о том, что угол разделён пополам?',
      hei:'Высота — про перпендикуляр. Какое высказывание говорит о прямом угле?',
      iso:'В равнобедренном треугольнике равны углы при основании. Основание — сторона без равных. Какие два угла лежат на основании?'
    }[t.sub];
    $$('#q2 .btn').forEach(b => b.addEventListener('click', () => {
      if(locked) return;
      const o = t.opts.find(x => x.id === b.dataset.id), btns = $$('#q2 .btn');
      const r = judge(g2, !!o.truth, {trap:'consequence', hint:`<p>${h2}</p>`, reveal:`<p>${t.okWhy}</p>`});
      if(r === 'right'){ locked = true; b.classList.add('good'); btns.forEach(x => x.disabled = true); paint(); finishTask(t.okWhy); }
      else if(r === 'hint'){ b.classList.add('bad'); b.disabled = true; paint(em1); }
      else{ locked = true; b.classList.add('bad'); btns.forEach(x => { x.disabled = true; if(t.opts.find(z => z.id === x.dataset.id).truth) x.classList.add('good'); }); paint(); finishTask(null); }
    }));
  }
}

/* ---------- запуск ---------- */
if(typeof document !== 'undefined' && document.getElementById('main')) boot();
</script>
