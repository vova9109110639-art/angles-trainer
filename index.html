<!doctype html>
<html lang="ru" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахта геометрии — тренажёр, 7 класс</title>
<meta name="description" content="Тренажёр по геометрии для 7 класса: смежные и вертикальные углы, треугольники. Чертежи каждый раз новые.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@1,500;1,700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --px:'Press Start 2P','Courier New',monospace;
  --txt:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Segoe UI Symbol','Cambria Math','DejaVu Sans',sans-serif;
  --ser:'Lora','Times New Roman',Georgia,'Cambria Math','Segoe UI Symbol',serif;
  --sky:#8fd0ff;
  --ink:#171717;
  --win:#c6c6c6; --win-hi:#ffffff; --win-lo:#555555;
  --panel:#e4e4e4;
  --btn:#bdbdbd; --btn-hi:#f6f6f6; --btn-lo:#696969; --btn-hover:#d6e4ff;
  --ok:#9be874; --warn:#ffd986; --info:#bcd6ff;
  --board:#f3ecd6; --board-ink:#161616;
  --xp:#5ed63b;
  --hor:150px; --blk:64px;
  --ground-filter:none;
}
:root[data-theme="night"]{
  --sky:#0a1030;
  --win:#a7a7b6; --win-hi:#dcdce8; --win-lo:#464658;
  --panel:#d4d4e0;
  --btn:#bcbccb; --btn-hi:#ececf6; --btn-lo:#5a5a6c; --btn-hover:#cfdcff;
  --board:#e7e0ca;
  --ground-filter:brightness(.42) saturate(.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--sky);color:var(--ink);font:400 17px/1.5 var(--txt);overflow-x:hidden}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- мир: небо, трава, земля, камень ---------- */
#world{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--sky)}
#world .sky{position:absolute;left:0;right:0;top:0;height:var(--hor)}
#world .stars{position:absolute;inset:0;display:none;background-repeat:repeat;background-size:768px 384px}
:root[data-theme="night"] #world .stars{display:block}
#world .cloud{position:absolute;image-rendering:pixelated;animation:drift 160s linear infinite alternate}
:root[data-theme="night"] #world .cloud{opacity:.16}
#world .c1{top:18px;left:6%;width:176px;height:auto}
#world .c2{top:70px;left:58%;width:128px;height:auto;animation-duration:210s}
#world .c3{top:8px;left:80%;width:96px;height:auto;animation-duration:260s}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
#world .orb{position:absolute;top:26px;right:9%;width:72px;height:72px;image-rendering:pixelated;display:none}
@media (min-width:760px){#world .orb{display:block}}
#world .ground,#world .deep{position:absolute;left:0;right:0;background-repeat:repeat-x;image-rendering:pixelated;filter:var(--ground-filter)}
#world .ground{top:var(--hor);height:calc(var(--blk)*4);background-size:calc(var(--blk)*24) calc(var(--blk)*4)}
#world .deep{top:calc(var(--hor) + var(--blk)*4);bottom:0;background-repeat:repeat;background-size:calc(var(--blk)*24) calc(var(--blk)*16)}
@media (max-width:560px){:root{--blk:48px;--hor:112px}#world .c1{width:128px}#world .c2{width:96px}#world .c3{width:64px}}
@media (prefers-reduced-motion:reduce){#world .cloud{animation:none}}

/* ---------- каркас ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:780px;margin:0 auto;padding:12px 12px 6px}
.logo{font-family:var(--px);font-size:13px;line-height:1.45;color:#fff;text-shadow:2px 2px 0 #1b2b45,-1px -1px 0 #1b2b45;cursor:pointer;background:none;border:0;padding:6px 0;text-align:left}
.logo small{display:block;font-size:8px;margin-top:4px;color:#fff}
.tools{display:flex;gap:6px;flex-wrap:nowrap}
@media (max-width:420px){.logo{font-size:12px}.logo small{font-size:7px}}
.wrap{max-width:780px;margin:0 auto;padding:6px 12px 110px}

/* ---------- окно-инвентарь ---------- */
.win{position:relative;background:var(--win);color:var(--ink);margin:10px 4px 18px;padding:16px 14px 18px;border-radius:0;
  box-shadow:inset 4px 4px 0 var(--win-hi),inset -4px -4px 0 var(--win-lo),0 0 0 4px #111}
.win.ok{animation:okflash .8s steps(8) 1}
.win.shake{animation:shake .4s steps(8) 1}
@keyframes okflash{0%,100%{outline:0 solid #3ddc3d}20%,60%{outline:6px solid #3ddc3d}40%,80%{outline:6px solid #c8ffb8}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}35%{transform:translateX(7px)}55%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.win.ok,.win.shake{animation:none}.win.ok{outline:6px solid #3ddc3d}.win.shake{outline:6px solid #e0a02a}}
.win h1,.win h2,.win h3{font-family:var(--px);font-weight:400;line-height:1.5;margin:0 0 10px}
.win h1{font-size:18px}
.win h2{font-size:14px}
.win h3{font-size:11px}
.inset{background:var(--panel);padding:12px;box-shadow:inset 3px 3px 0 var(--win-lo),inset -3px -3px 0 var(--win-hi)}
.lead{font-size:18px;margin:0 0 12px}
.muted{opacity:.78;font-size:15px}
.px{font-family:var(--px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

/* ---------- кнопки как в игровом меню ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  font-family:var(--px);font-size:11px;line-height:1.6;color:var(--ink);background:var(--btn);
  min-height:52px;min-width:52px;padding:10px 14px;margin:0;border:0;border-radius:0;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  box-shadow:inset 4px 4px 0 var(--btn-hi),inset -4px -4px 0 var(--btn-lo),0 0 0 3px #111}
.btn:hover{background:var(--btn-hover);box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 var(--btn-lo),0 0 0 3px #111,0 0 0 6px #ffe36b}
.btn:active,.btn.pressed{transform:translateY(2px);box-shadow:inset 4px 4px 0 var(--btn-lo),inset -4px -4px 0 var(--btn-hi),0 0 0 3px #111}
.btn:focus-visible{outline:4px solid #1d4ed8;outline-offset:5px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn[disabled]:hover{background:var(--btn);box-shadow:inset 4px 4px 0 var(--btn-hi),inset -4px -4px 0 var(--btn-lo),0 0 0 3px #111}
.btn.block{display:flex;width:100%}
.btn.big{min-height:60px;font-size:12px}
.btn.good,.btn.good[disabled],.btn.good[disabled]:hover{background:var(--ok);opacity:1}
.btn.bad,.btn.bad[disabled],.btn.bad[disabled]:hover{background:var(--warn);opacity:.9}
.btn.math{font-family:var(--ser);font-style:italic;font-weight:700;font-size:25px;letter-spacing:.5px;line-height:1.2}
.btn.math .ang,.m .ang{font-style:normal;font-weight:400;font-size:1.2em;font-family:'Segoe UI Symbol','Cambria Math','DejaVu Sans','Noto Sans Math',sans-serif}
.btn.sel{background:#ffe9a6}
.btn.ibtn{width:44px;min-width:44px;min-height:44px;padding:0}
.btn.ibtn img{width:26px;height:26px;display:block}
.btn.lock{opacity:.7}
.opts{display:grid;gap:12px;grid-template-columns:1fr;margin:14px 3px 4px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:330px){.opts.two{grid-template-columns:1fr}}

/* ---------- текст задач ---------- */
.task{font:600 20px/1.5 var(--txt);margin:0 0 6px}
.task .m,.m{font-family:var(--ser);font-style:italic;font-weight:700;font-size:1.18em;white-space:nowrap}
.task .m.n,.m.n{font-family:var(--txt);font-style:normal;font-weight:700;font-size:1.05em}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;font:500 17px/1.3 var(--txt)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:22px;box-shadow:0 0 0 2px #111;flex:none}
.sw.a{background:repeating-conic-gradient(#f2b705 0 25%,#ffe27a 0 50%) 0 0/8px 8px}
.sw.b{background:repeating-linear-gradient(#1d8fb8 0 3px,#8be0f7 3px 8px)}
.badge{display:inline-block;font-family:var(--px);font-size:9px;line-height:1.5;padding:6px 8px;background:#ffe9a6;box-shadow:inset 0 0 0 2px #111;margin:6px 0 0}

/* ---------- чертёж на «табличке» ---------- */
.board{position:relative;background:var(--board);margin:12px auto 8px;padding:12px;max-width:480px;
  box-shadow:inset 0 0 0 4px #7a4b1f,inset 0 0 0 8px #bd8840,0 0 0 3px #111}
.board:before,.board:after{content:"";position:absolute;width:6px;height:6px;background:#3b3b3b;top:11px}
.board:before{left:11px}.board:after{right:11px}
.board svg{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.board svg.tap{cursor:pointer}
.lt{font:italic 700 27px 'Lora','Times New Roman',serif;fill:#111;paint-order:stroke;stroke:var(--board);stroke-width:5px;stroke-linejoin:round}
.lt.o{font-size:23px}
.tag-n{font:700 15px 'Inter',sans-serif;fill:#222;text-anchor:middle}
.val{font:700 16px 'Inter',sans-serif;fill:#111;text-anchor:middle}
.val.q{fill:#6b4f1a;font-size:19px}
.rayem{stroke:#3b82f6;stroke-width:12;stroke-linecap:square}
.fb,#nextbar{scroll-margin-bottom:100px}
.pulse{animation:pulse .9s steps(2) infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ---------- обратная связь ---------- */
.fb{margin:14px 3px 4px;padding:12px 14px;font:500 18px/1.5 var(--txt);box-shadow:inset 0 0 0 3px #111}
.fb .tag{display:block;font-family:var(--px);font-size:10px;line-height:1.5;margin-bottom:6px}
.fb.ok{background:var(--ok)}.fb.hint{background:var(--warn)}.fb.show{background:var(--info)}
.fb p{margin:0 0 6px}.fb p:last-child{margin:0}
.fb .m{font-size:1.12em}
.log{margin:14px 3px 0;padding:0;list-style:none;font:500 16px/1.45 var(--txt)}
.log li{padding:6px 8px;margin:0 0 6px;background:var(--panel);box-shadow:inset 3px 0 0 #3ea72a}
.log li.w{box-shadow:inset 3px 0 0 #d99a1d}
.field{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:14px 3px 4px}
.field input{flex:1 1 120px;min-width:0;min-height:56px;font:700 26px var(--txt);text-align:center;padding:6px 10px;background:#fff;color:#111;border:0;border-radius:0;
  box-shadow:inset 4px 4px 0 #555,inset -4px -4px 0 #eee,0 0 0 3px #111}
.field input:focus{outline:4px solid #1d4ed8;outline-offset:4px}
.field .u{align-self:center;font:700 26px var(--txt)}
.steplab{font-family:var(--px);font-size:10px;line-height:1.5;margin:14px 3px 6px}
.qtext{font:600 20px/1.45 var(--txt);margin:2px 3px 0}

/* ---------- фишки для режима 3 ---------- */
.tray{display:flex;gap:10px;flex-wrap:wrap;margin:12px 3px 4px;min-height:56px;align-items:center}
.chip{font:700 24px var(--txt);padding:10px 16px;min-height:56px;background:#fff7d6;color:#111;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;
  box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #b49a4b,0 0 0 3px #111}
.chip.arm{background:#ffd54a;box-shadow:inset 3px 3px 0 #fff3b8,inset -3px -3px 0 #a47d00,0 0 0 3px #111,0 0 0 6px #1d4ed8}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%)}

/* ---------- XP и счётчики ---------- */
.xp{display:flex;gap:3px;background:#111;padding:3px;margin:6px 0 4px}
.xp i{flex:1;height:16px;background:#35523a;display:block}
.xp i.on{background:var(--xp);box-shadow:inset 0 4px 0 #a6f58b,inset 0 -4px 0 #2b8a17}
.xpl{display:flex;justify-content:space-between;gap:8px;font-family:var(--px);font-size:9px;line-height:1.6}
.cnt{font-family:var(--px);font-size:9px;line-height:1.7}
.cnt b{font-weight:400;background:var(--panel);padding:2px 6px;box-shadow:inset 0 0 0 2px #111}

/* ---------- главная: шахты ---------- */
.mine{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:0 0 14px;min-height:76px}
.mine .dep{font-family:var(--px);font-size:10px;line-height:1.6;display:block}
.mine .nm{font-family:var(--px);font-size:12px;line-height:1.6;display:block;margin:2px 0 4px}
.mine .ds{font:500 15px/1.35 var(--txt);display:block}
.mine .ic{flex:none;width:44px;height:44px;display:grid;place-items:center}
.mine .ic img{width:40px;height:40px}
.mine .st{flex:none;font-family:var(--px);font-size:9px;text-align:right;line-height:1.7}

/* ---------- хотбар ---------- */
#hotbar{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;background:#111;padding:3px;gap:2px;
  --s:min(48px,calc((100vw - 22px)/9))}
.hb{position:relative;width:var(--s);height:var(--s);background:#8b8b8b;display:grid;place-items:center;
  box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #fff}
.hb img{width:68%;height:68%;display:block}
.hb b{position:absolute;right:2px;bottom:0;font-family:var(--px);font-weight:400;font-size:8px;color:#fff;text-shadow:1px 1px 0 #000}
.hb.new{animation:hbpop .9s steps(6) 1}
@keyframes hbpop{0%,100%{background:#8b8b8b}30%,70%{background:#ffe36b}}
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:12px;max-width:calc(100vw - 24px);
  background:var(--win);padding:12px 16px;font-family:var(--px);font-size:11px;line-height:1.6;box-shadow:inset 3px 3px 0 var(--win-hi),inset -3px -3px 0 var(--win-lo),0 0 0 3px #111}
#toast.on{display:flex;animation:toastin .5s steps(5) 1}
#toast img{width:40px;height:40px}
@keyframes toastin{from{transform:translate(-50%,-24px)}to{transform:translate(-50%,0)}}

/* ---------- страница учителя ---------- */
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px;padding:10px;background:var(--panel);box-shadow:inset 3px 3px 0 var(--win-lo),inset -3px -3px 0 var(--win-hi)}
.srow .nm{grid-column:1/-1;font:700 17px/1.3 var(--txt)}
.srow .c{font:500 14px/1.3 var(--txt)}
.srow .c b{display:block;font:700 22px/1.2 var(--txt)}
.bar{height:12px;background:#9d9d9d;box-shadow:inset 0 0 0 2px #111;position:relative;grid-column:1/-1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#e0a02a}
.err li{margin:0 0 8px}
.err .meter{display:block;height:10px;background:#e0a02a;margin-top:3px}
pre.rep{margin:0;padding:10px;background:#1b1b1b;color:#dfffd0;font:13px/1.45 'Consolas','Courier New',monospace;white-space:pre-wrap;overflow-wrap:anywhere}
noscript{display:block;padding:20px;background:#fff;font:18px var(--txt)}
</style>
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="px-a" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffe27a"/><rect width="4" height="4" fill="#f2b705"/><rect x="4" y="4" width="4" height="4" fill="#f2b705"/></pattern>
    <pattern id="px-b" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#8be0f7"/><rect width="8" height="3" fill="#1d8fb8"/></pattern>
    <pattern id="px-ok" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#b9f2a0"/><rect width="4" height="4" fill="#4cc22b"/><rect x="4" y="4" width="4" height="4" fill="#4cc22b"/></pattern>
    <pattern id="px-bad" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffd9a0"/><rect width="4" height="4" fill="#f0a030"/><rect x="4" y="4" width="4" height="4" fill="#f0a030"/></pattern>
    <pattern id="px-sel" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#dcd0ff"/><rect width="4" height="4" fill="#9a82f0"/><rect x="4" y="4" width="4" height="4" fill="#9a82f0"/></pattern>
  </defs>
</svg>
<div id="world" aria-hidden="true">
  <div class="sky"><div class="stars" id="stars"></div><img class="orb" id="orb" alt=""><img class="cloud c1" id="cl1" alt=""><img class="cloud c2" id="cl2" alt=""><img class="cloud c3" id="cl3" alt=""></div>
  <div class="ground" id="ground"></div>
  <div class="deep" id="deep"></div>
</div>
<header class="top">
  <button class="logo" id="logo" type="button" aria-label="На главную">ШАХТА ГЕОМЕТРИИ<small>УГЛЫ И ТРЕУГОЛЬНИКИ</small></button>
  <div class="tools">
    <button class="btn ibtn" id="bSound" type="button" aria-label="Звук" title="Звук"><img alt=""></button>
    <button class="btn ibtn" id="bTheme" type="button" aria-label="Тема" title="День / ночь"><img alt=""></button>
    <button class="btn ibtn" id="bTeacher" type="button" aria-label="Для учителя" title="Для учителя"><img alt=""></button>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="hotbar" aria-label="Добытые блоки"></div>
<noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>
'use strict';
/* =====================================================================
   ШАХТА УГЛОВ — тренажёр «Смежные и вертикальные углы», 7 класс.
   Один файл, без зависимостей. Логика (генераторы, проверки) отделена
   от интерфейса: см. разделы 1–7 (чистая логика) и 8+ (интерфейс).
   ===================================================================== */

/* ---------- 1. утилиты, генератор случайных чисел ---------- */
let _rng = Math.random;
function setRng(f){ _rng = f || Math.random; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = () => _rng();
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));          // целое от a до b включительно
const pick = arr => arr[Math.floor(rnd() * arr.length)];
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const mod360 = x => ((x % 360) + 360) % 360;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = 'ABCDEFGHKLMNPQRST'.split('');                     // без O (это вершина), I и J

/* ---------- 2. режимы, названия типов задач ---------- */
const NEED = 8, ROUND = 10;                                         // 8 верных из 10 — следующая шахта открыта
const MODES = [null,
  {id:1, name:'Найди угол',          desc:'Угол по трём буквам на чертеже'},
  {id:2, name:'Какие это углы?',     desc:'Смежные, вертикальные или ни то ни другое'},
  {id:3, name:'Перенеси условие',    desc:'Условие из учебника → числа на чертеже'},
  {id:4, name:'Реши по шагам',       desc:'Задача в 2–3 шага с вопросами'},
  {id:5, name:'Как в учебнике',      desc:'Задача целиком, только ответ'},
  {id:6, name:'Найди элемент',       desc:'Угол, сторона, треугольник по буквам'},
  {id:7, name:'Что это такое?',      desc:'Медиана, биссектриса, высота; вид треугольника'},
  {id:8, name:'Перенеси условие',    desc:'Условие из учебника → пометки на чертеже'},
  {id:9, name:'Реши по шагам',       desc:'Задача в 2–3 шага с вопросами'},
  {id:10, name:'Как в учебнике',     desc:'Задача целиком, только ответ'}
];

/* ---------- 3. сохранение прогресса (localStorage — необязателен) ---------- */
const LS_KEY = 'shakhta-uglov-v1';
function newModeState(){ return {self:0, hint:0, shown:0, rounds:0, passed:false, round:{n:0, ok:0, miss:0}}; }
function defState(){
  return {v:1, sound:false, theme:null, allOpen:false, selfTotal:0, mined:0,
          modes:(() => { const m = {}; for(let i = 1; i <= 10; i++) m[i] = newModeState(); return m; })(),
          types:{}, traps:{}};
}
let S = defState();
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(!o || o.v !== 1) return;
    const d = defState();
    S = Object.assign(d, o);
    S.modes = {};
    for(let m = 1; m <= 10; m++) S.modes[m] = Object.assign(newModeState(), (o.modes || {})[m] || {}, {round:Object.assign({n:0, ok:0, miss:0}, ((o.modes || {})[m] || {}).round || {})});
    S.types = o.types || {}; S.traps = o.traps || {};
  }catch(e){ /* без localStorage всё работает, просто прогресс не сохранится */ }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function resetState(){ S = defState(); saveState(); }
const isOpen = m => m === topicOf(m).first || S.allOpen || !!S.modes[m - 1].passed;

/* ---------- 4. учёт результатов ---------- */
function statOf(type){ return S.types[type] || (S.types[type] = {n:0, self:0, hint:0, shown:0, err:0}); }
function noteTrap(key){ if(!key) return; S.traps[key] = (S.traps[key] || 0) + 1; }
/* outcome: 'self' (сам, с первой попытки) | 'hint' (верно после подсказки) | 'shown' (показали решение) */
function recordTask(mode, type, outcome, errs){
  const m = S.modes[mode], t = statOf(type), r = m.round;
  m[outcome]++; t.n++; t[outcome]++; t.err += errs;
  r.n++; if(outcome === 'shown') r.miss++; else r.ok++;
  let mined = 0;
  if(outcome === 'self'){ S.selfTotal++; if(S.selfTotal % 5 === 0){ S.mined++; mined = S.mined; } }
  let verdict = null;
  if(r.ok >= NEED){ verdict = 'win'; m.passed = true; m.rounds++; }
  else if(r.miss > ROUND - NEED){ verdict = 'lose'; m.rounds++; }
  saveState();
  return {mined, verdict};
}
function newRound(mode){ S.modes[mode].round = {n:0, ok:0, miss:0}; saveState(); }
const ORES = ['coal', 'iron', 'gold', 'diamond'];

/* блок №k (k = 1, 2, …) лежит в ячейке (k-1) % 9; в ячейке i всегда один и тот же материал */
function hotbarCounts(){
  const out = [];
  for(let i = 0; i < 9; i++) out.push(S.mined > i ? Math.floor((S.mined - 1 - i) / 9) + 1 : 0);
  return out;
}

/* ---------- 5. геометрия: лучи из точки O, углы — целые градусы ---------- */
/* Луч задаётся углом (в градусах, против часовой стрелки от оси «вправо»).
   Угол ∠XOY — это пара лучей {from, to}: от луча from против часовой к лучу to. */
function makeFigure(opts){
  const raw = [];
  opts.lines.forEach((d, k) => { raw.push({ang:mod360(d), line:k}); raw.push({ang:mod360(d + 180), line:k}); });
  (opts.free || []).forEach(d => raw.push({ang:mod360(d), line:-1}));
  raw.sort((a, b) => a.ang - b.ang);
  const lets = shuffle(LETTERS).slice(0, raw.length);
  const rays = raw.map((r, i) => ({ang:r.ang, line:r.line, letter:lets[i], i}));
  const n = rays.length;
  const sec = rays.map((r, i) => {
    const nx = rays[(i + 1) % n];
    return {i, from:i, to:(i + 1) % n, a0:r.ang, size:mod360(nx.ang - r.ang) || 360};
  });
  return {rays, n, sec, nLines:opts.lines.length, nFree:(opts.free || []).length};
}
/* две или три прямые через O; все углы между соседними лучами — от 22° до 158° */
function lineFigure(nl, rot, alpha){
  if(rot == null) rot = ri(0, 359);
  let dirs;
  if(nl === 2){ const a = alpha || ri(22, 158); dirs = [rot, rot + a]; }
  else{
    let a, b, c;
    do{ a = ri(22, 110); b = ri(22, 110); c = 180 - a - b; }while(c < 22);
    dirs = [rot, rot + a, rot + a + b];
  }
  return makeFigure({lines:dirs});
}
/* прямая и один луч из точки на ней: A–O–C на прямой, OB — отдельный луч */
function lineRayFigure(p){
  const rot = ri(0, 359);
  p = p || ri(22, 158);
  return makeFigure({lines:[rot], free:[rot + p]});
}
/* чертёж, в котором разные «классы» углов отличаются хотя бы на 3° и нет прямых углов — чтобы числа не совпадали случайно */
function distinctFig(nl){
  for(;;){
    const fig = lineFigure(nl);
    const s = fig.sec.slice(0, nl === 2 ? 2 : 3).map(x => x.size);
    let ok = nl !== 2 || s[0] !== 90;
    for(let i = 0; i < s.length; i++) for(let j = i + 1; j < s.length; j++) if(Math.abs(s[i] - s[j]) < 3) ok = false;
    if(nl === 2 && Math.abs(s[0] - 90) < 3) ok = false;
    if(ok) return fig;
  }
}
const rayAng = (fig, i) => fig.rays[i].ang;
const angSize = (fig, A) => mod360(rayAng(fig, A.to) - rayAng(fig, A.from));
const angOfSector = (fig, i) => ({from:i, to:(i + 1) % fig.n});
function angSectors(fig, A){                       // номера секторов, из которых состоит угол
  const out = []; let i = A.from;
  while(i !== A.to){ out.push(i); i = (i + 1) % fig.n; if(out.length > fig.n) break; }
  return out;
}
const angContains = (fig, A, deg) => mod360(deg - rayAng(fig, A.from)) < angSize(fig, A);
const oppRay = (fig, i) => fig.rays.findIndex(r => r.ang === mod360(fig.rays[i].ang + 180));
const vertOf = (fig, A) => ({from:oppRay(fig, A.from), to:oppRay(fig, A.to)});
const sameAngle = (A, B) => A.from === B.from && A.to === B.to;
/* Главная функция-«судья»: смежные / вертикальные / никакие — считаем по градусам лучей. */
function relation(fig, A, B){
  const a0 = rayAng(fig, A.from), a1 = rayAng(fig, A.to), b0 = rayAng(fig, B.from), b1 = rayAng(fig, B.to);
  if(angSize(fig, A) >= 180 || angSize(fig, B) >= 180) return 'none';
  if(mod360(a0 + 180) === b0 && mod360(a1 + 180) === b1) return 'vert';
  if(a1 === b0 && mod360(a0 + 180) === b1) return 'adj';      // A, затем B: общий луч OB, внешние лучи — продолжения друг друга
  if(b1 === a0 && mod360(b0 + 180) === a1) return 'adj';
  return 'none';
}
const share = (fig, A, B) => A.from === B.from || A.from === B.to || A.to === B.from || A.to === B.to;
/* запись угла по трём буквам: вершина O всегда средняя */
function angText(fig, A, rev){
  const x = fig.rays[A.from].letter, y = fig.rays[A.to].letter;
  return rev ? '∠' + y + 'O' + x : '∠' + x + 'O' + y;
}
/* нумерация секторов 1..n против часовой, начиная с сектора start (для двух прямых) */
function numberSectors(fig, start){ const num = []; for(let j = 0; j < fig.n; j++) num[(start + j) % fig.n] = j + 1; return num; }
const sectorOfNum = (num, k) => num.indexOf(k);

/* ---------- 6. рисование чертежа (SVG строкой) ---------- */
const CX = 180, CY = 180, RAY = 142, FILL = 128, LETR = 164;
const P = (r, deg) => { const t = deg * Math.PI / 180; return [CX + r * Math.cos(t), CY - r * Math.sin(t)]; };
const f1 = x => Math.round(x * 10) / 10;
const wedge = (a0, size, r) => { const p = P(r, a0), q = P(r, a0 + size); return `M${CX} ${CY}L${f1(p[0])} ${f1(p[1])}A${r} ${r} 0 ${size > 180 ? 1 : 0} 0 ${f1(q[0])} ${f1(q[1])}Z`; };
const arcPath = (a0, size, r) => { const p = P(r, a0), q = P(r, a0 + size); return `M${f1(p[0])} ${f1(p[1])}A${r} ${r} 0 ${size > 180 ? 1 : 0} 0 ${f1(q[0])} ${f1(q[1])}`; };
const sinHalf = size => Math.sin(Math.min(size, 170) * Math.PI / 360);
const valR = size => clamp(30 / (2 * sinHalf(size)) + 30, 76, 114);       // куда ставить число внутри угла
const numR = size => clamp(14 / (2 * sinHalf(size)) + 26, 40, 62);        // куда ставить номер угла

/* o.fills: [{A, pat}]  заливка угла (pat: a, b, ok, bad, sel)
   o.arcs: [{A, r, color}]  дуги
   o.rayEm: [индексы лучей]  выделенные лучи
   o.labels: [{deg, r, text, cls, box:[w,h], fill}]  подписи в углах
   o.letters: показывать буквы (по умолчанию да)
   o.extra: готовый SVG-код поверх чертежа */
function drawFigure(fig, o){
  o = o || {};
  let s = `<svg viewBox="0 0 360 360" role="img" aria-label="${esc(o.aria || 'Чертёж: лучи из точки O')}" style="overflow:visible"${o.attrs ? ' ' + o.attrs : ''}>`;
  (o.fills || []).forEach(f => {
    const a0 = rayAng(fig, f.A.from), size = angSize(fig, f.A);
    s += `<path d="${wedge(a0, size, FILL)}" fill="url(#px-${f.pat})" shape-rendering="crispEdges"/>`;
    s += `<path d="${arcPath(a0, size, FILL)}" fill="none" stroke="#222" stroke-width="2" shape-rendering="crispEdges"/>`;
  });
  (o.rayEm || []).forEach(i => { const p = P(RAY, rayAng(fig, i)); s += `<line class="rayem pulse" x1="${CX}" y1="${CY}" x2="${f1(p[0])}" y2="${f1(p[1])}"/>`; });
  fig.rays.forEach(r => {
    const p = P(RAY, r.ang);
    s += `<line x1="${CX}" y1="${CY}" x2="${f1(p[0])}" y2="${f1(p[1])}" stroke="#161616" stroke-width="3.5" stroke-linecap="square"/>`;
    s += `<rect x="${f1(p[0] - 4.5)}" y="${f1(p[1] - 4.5)}" width="9" height="9" fill="#161616"/>`;
  });
  (o.arcs || []).forEach(a => {
    s += `<path d="${arcPath(rayAng(fig, a.A.from), angSize(fig, a.A), a.r)}" fill="none" stroke="${a.color || '#161616'}" stroke-width="3.5" shape-rendering="crispEdges"/>`;
  });
  s += `<rect x="${CX - 4}" y="${CY - 4}" width="8" height="8" fill="#161616"/>`;
  // буква O — в самом широком секторе, чтобы не мешать подписям
  const wide = fig.sec.filter(x => x.size <= 180).sort((a, b) => b.size - a.size)[0] || fig.sec[0];
  const op = P(wide.size >= 100 ? 15 : 19, wide.a0 + wide.size / 2);
  s += `<text class="lt o" x="${f1(op[0])}" y="${f1(op[1])}" text-anchor="middle" dy=".35em">O</text>`;
  (o.labels || []).forEach(L => {
    const p = P(L.r, L.deg), x = f1(p[0]), y = f1(p[1]);
    if(L.box) s += `<rect x="${f1(x - L.box[0] / 2)}" y="${f1(y - L.box[1] / 2)}" width="${L.box[0]}" height="${L.box[1]}" fill="${L.fill || '#fff'}" stroke="#111" stroke-width="2" shape-rendering="crispEdges"/>`;
    s += `<text class="${L.cls || 'val'}" x="${x}" y="${y}" dy=".35em">${esc(L.text)}</text>`;
  });
  if(o.letters !== false){
    fig.rays.forEach(r => {
      const p = P(LETR, r.ang);
      s += `<text class="lt" x="${f1(p[0])}" y="${f1(p[1])}" text-anchor="middle" dy=".35em">${r.letter}</text>`;
    });
  }
  s += (o.extra || '') + '</svg>';
  return s;
}
/* определить, в какой сектор попал палец / курсор (координаты в системе viewBox 360×360) */
function sectorAtPoint(fig, x, y){
  const dx = x - CX, dy = CY - y;
  if(Math.hypot(dx, dy) < 14) return -1;
  const t = mod360(Math.atan2(dy, dx) * 180 / Math.PI);
  for(const s of fig.sec) if(s.size <= 180 && mod360(t - s.a0) < s.size) return s.i;
  return -1;
}
const pointAngle = (x, y) => mod360(Math.atan2(CY - y, x - CX) * 180 / Math.PI);

/* ===== режим 1: «Найди угол» ===== */
const nameKey = (mid, a, b) => mid + '|' + [a, b].sort().join('');
function nameOptions(fig, A){
  const L = k => fig.rays[k].letter, n = fig.n;
  const x = A.from, y = A.to, size = angSize(fig, A);
  const opts = [], seen = new Set();
  const add = (kind, text, key) => { if(seen.has(key)) return false; seen.add(key); opts.push({kind, text}); return true; };
  add('ok', angText(fig, A, rnd() < 0.5), nameKey('O', L(x), L(y)));
  // ловушка «вершина не в середине»
  const mid = rnd() < 0.5 ? x : y, other = mid === x ? y : x;
  const offText = (m, o) => rnd() < 0.5 ? `∠O${L(m)}${L(o)}` : `∠${L(o)}${L(m)}O`;
  add('vertexMid', offText(mid, other), nameKey(L(mid), 'O', L(other)));
  // соседние, вертикальный, «лишний сектор»
  const nbNext = {from:y, to:(y + 1) % n}, nbPrev = {from:(x - 1 + n) % n, to:x};
  const cands = [['neighbor', nbNext], ['neighbor', nbPrev], ['vertical', vertOf(fig, A)]];
  const wide = {from:x, to:(y + 1) % n};
  if(angSize(fig, wide) < 180 && angSize(fig, wide) > size) cands.push(['wider', wide]);
  const sh = shuffle(cands);
  const nb = sh.find(c => c[0] === 'neighbor');                         // хотя бы один соседний — самая частая ошибка
  const rest = sh.filter(c => c !== nb);
  for(const c of [nb].concat(rest)){
    if(opts.length >= 4) break;
    add(c[0], angText(fig, c[1], rnd() < 0.5), nameKey('O', L(c[1].from), L(c[1].to)));
  }
  if(opts.length < 4) add('vertexMid', offText(other, mid), nameKey(L(other), 'O', L(mid)));
  const order = shuffle(opts);
  return {list:order, correct:order.findIndex(o => o.kind === 'ok')};
}
function gen1(){
  const variant = rnd() < 0.55 ? 'find' : 'name';
  const nl = rnd() < 0.5 ? 2 : 3;
  const fig = lineFigure(nl);
  const span = (nl === 3 && rnd() < 0.4) ? 2 : 1;
  const from = ri(0, fig.n - 1);
  const A = {from, to:(from + span) % fig.n};
  const rev = rnd() < 0.5;
  const kind = span === 2 ? 'c' : String(nl);
  const t = {mode:1, variant, type:`m1.${variant}.${kind}`, fig, A, rev, text:angText(fig, A, rev), span};
  if(variant === 'name') t.opts = nameOptions(fig, A);
  return t;
}

/* ===== режим 2: «Какие это углы?» ===== */
const disjoint = (fig, A, B) => !angSectors(fig, A).some(i => angSectors(fig, B).includes(i));
function randAng(fig, maxSpan){
  const from = ri(0, fig.n - 1), span = ri(1, maxSpan);
  const A = {from, to:(from + span) % fig.n};
  return angSize(fig, A) < 180 ? A : null;
}
function pairSearch(fig, maxSpan, test){
  for(let k = 0; k < 1500; k++){
    const A = randAng(fig, maxSpan), B = randAng(fig, maxSpan);
    if(!A || !B || sameAngle(A, B) || !disjoint(fig, A, B)) continue;
    if(test(A, B)) return [A, B];
  }
  return null;
}
/* три луча OA, OB, OC без «прямой»: ∠AOB = a, ∠BOC = b (рисуем a_d и b_d — для «не в масштабе» они другие) */
function raysFigure(t0, ad, bd){
  const fig = makeFigure({lines:[], free:[t0, t0 + ad, t0 + ad + bd]});
  const idx = a => fig.rays.findIndex(r => r.ang === mod360(a));
  return {fig, A:{from:idx(t0), to:idx(t0 + ad)}, B:{from:idx(t0 + ad), to:idx(t0 + ad + bd)}};
}
function gen2(){
  const r = rnd();
  const kind = r < 0.2 ? 'adj' : r < 0.4 ? 'vert' : r < 0.56 ? 'shared3' : r < 0.68 ? 'far' : r < 0.88 ? 'near' : 'scale';
  let fig, A, B, ans, type, nums = null, banner = '';
  if(kind === 'adj' || kind === 'vert'){
    const nl = rnd() < 0.5 ? 2 : 3;
    fig = lineFigure(nl);
    const pr = pairSearch(fig, nl === 3 && rnd() < 0.5 ? 2 : 1, (a, b) => relation(fig, a, b) === kind);
    if(!pr) return gen2();
    [A, B] = pr;
    ans = kind; type = 'm2.' + kind;
  }else if(kind === 'shared3'){
    fig = lineFigure(3);
    const pr = pairSearch(fig, rnd() < 0.3 ? 2 : 1, (a, b) => relation(fig, a, b) === 'none' && share(fig, a, b)
      && Math.abs(angSize(fig, a) - angSize(fig, b)) >= 4 && angSize(fig, a) + angSize(fig, b) !== 180);
    if(!pr) return gen2();
    [A, B] = pr;
    ans = 'none'; type = 'm2.shared3';
  }else if(kind === 'far'){
    fig = lineFigure(3);
    const pr = pairSearch(fig, 1, (a, b) => relation(fig, a, b) === 'none' && !share(fig, a, b)
      && Math.abs(angSize(fig, a) - angSize(fig, b)) >= 4 && angSize(fig, a) + angSize(fig, b) !== 180);
    if(!pr) return gen2();
    [A, B] = pr;
    ans = 'none'; type = 'm2.far';
  }else if(kind === 'near'){
    // общий луч есть; внешние лучи почти (или ровно) на одной прямой; числа подписаны на чертеже
    const exact = rnd() < 0.3, d = exact ? 0 : pick([-1, 1]) * ri(4, 16);
    const a = ri(40, 140), b = 180 + d - a;
    const o = raysFigure(ri(0, 359), a, b);
    fig = o.fig; A = o.A; B = o.B; nums = [a, b];
    ans = exact ? 'adj' : 'none'; type = exact ? 'm2.numadj' : 'm2.near180';
  }else{
    // «рисунку не верь»: нарисовано одно, числа говорят другое
    const exact = rnd() < 0.4;
    let a, b;

/* стороны пары углов: общий луч и два внешних */

    return `Вертикальные: ${ray(t.A.from)} продолжается в ${ray(oppRay(fig, t.A.from))}, а ${ray(t.A.to)} — в ${ray(oppRay(fig, t.A.to))}: стороны одного угла продолжают стороны другого. Вертикальные углы равны.`;

function check3vals(t, placed){
  const issues = [];

    const p = placed[i], e = t.expected[i];
    if(e !== undefined){
      if(p === undefined) issues.push({kind:t.givens.includes(i) ? 'missGiven' : 'skipVert', i});
      else if(p !== e) issues.push({kind:'wrongPlace', i, got:p});

  return {angles:stepAngles(C.fig, [[big, 'a'], [small, 'b']]), qs:[mkQRel(C, big, small), mkQRule('sum180'),
    mkQNum(`Чему равна сумма ${P} + ${Q}?`, 180, {label:`сумма ${P} + ${Q}`, hint:'Это смежные углы: вместе они образуют развёрнутый угол. Сколько градусов в нём?',
      wrongs:[{v:360, msg:'360° — полный оборот. А смежные углы вместе — только развёрнутый угол.'}], short:`${P} + ${Q} = 180°.`})]};
}
function genDiff(){

      mkQNum(`Если у большего угла убрать лишние ${d}°, углы станут равными, а вместе будут ${180 - d}°. Чему равен меньший угол ${Q}?`, x,
        {label:`меньший угол ${Q}`, hint:`Из 180° убери лишние ${d}° — останется два равных угла. Раздели результат на 2.`,
         wrongs:[{v:y, msg:`${y}° — это больший угол ${P}. Мы ищем меньший, ${Q}.`}, {v:180 - d, msg:`${180 - d}° — это два равных угла вместе. Нужен один из них: раздели пополам.`}],
         short:`(180° − ${d}°) : 2 = ${x}°, это ${Q}.`, place:[{sec:small, v:x}]})]}];

function genKtimes(){

/* =====================================================================
   9. САМОПРОВЕРКА МАТЕМАТИКИ
   selfCheck(200) генерирует по N/5 задач каждого режима (с фиксированным зерном,
   чтобы результат повторялся) и проверяет, что ответ согласован с условием и чертежом:
   смежные дают 180°, вертикальные равны, вокруг точки 360°, углы — целые от 20° до 160°,
   вершина в записи ∠ABC — средняя буква, а нарисованные лучи и заливки стоят под теми же
   градусами, которые написаны в задаче (углы читаются прямо из SVG-кода чертежа).
   ===================================================================== */
function svgRayAngles(svg){
  const out = [], re = /<line x1="180" y1="180" x2="([\d.\-]+)" y2="([\d.\-]+)" stroke="#161616"/g;
  let m; while((m = re.exec(svg))) out.push(mod360(Math.atan2(180 - +m[2], +m[1] - 180) * 180 / Math.PI));
  return out;
}
function svgWedges(svg){                    // заливки: [{from, size}] в градусах, разобранные из path
  const out = [], re = /d="M180 180L([\d.\-]+) ([\d.\-]+)A\d+ \d+ 0 [01] 0 ([\d.\-]+) ([\d.\-]+)Z"/g;
  let m; while((m = re.exec(svg))){
    const a0 = mod360(Math.atan2(180 - +m[2], +m[1] - 180) * 180 / Math.PI), a1 = mod360(Math.atan2(180 - +m[4], +m[3] - 180) * 180 / Math.PI);
    out.push({from:a0, size:mod360(a1 - a0)});
  }
  return out;
}
const degNums = html => Array.from(String(html).replace(/<[^>]*>/g, '').matchAll(/(\d+)°/g)).map(m => +m[1]);
const plainText = html => String(html).replace(/<[^>]*>/g, '');

function selfCheck(N, seed){
  N = N || 200;
  const prev = _rng, SEED = seed || 20261028;
  setRng(mulberry32(SEED));
  const R = {N, seed:SEED, tasks:{}, checks:{}, fails:[], total:0};
  let ctx = '';
  const chk = (name, cond, detail) => {
    const c = R.checks[name] || (R.checks[name] = {ok:0, bad:0});
    if(cond) c.ok++; else { c.bad++; if(R.fails.length < 15) R.fails.push(`${ctx} — ${name}${detail ? ' (' + detail + ')' : ''}`); }
  };
  const near = (a, b) => Math.abs(mod360(a - b + 180) - 180) < 0.3;
  const letterIdx = (fig, ch) => fig.rays.findIndex(r => r.letter === ch);

  function checkFigure(fig){
    const n = fig.n, tot = fig.sec.reduce((a, s) => a + s.size, 0);
    chk('вокруг точки O — полный угол 360°', tot === 360, 'сумма ' + tot);
    chk('лучи заданы целыми градусами', fig.rays.every(r => Number.isInteger(r.ang)));
    chk('буквы на лучах разные и не совпадают с вершиной O', new Set(fig.rays.map(r => r.letter)).size === n && !fig.rays.some(r => r.letter === 'O'));
    if(fig.nFree === 0){
      const half = n / 2, span = fig.nLines === 2 ? 2 : 3;
      chk('вертикальные углы равны', fig.sec.every((s, i) => s.size === fig.sec[(i + half) % n].size));
      chk('углы подряд на одной прямой дают 180°', fig.sec.every((s, i) => { let q = 0; for(let k = 0; k < span; k++) q += fig.sec[(i + k) % n].size; return q === 180; }));
      chk('каждый угол на чертеже — целое число от 20° до 160°', fig.sec.every(s => Number.isInteger(s.size) && s.size >= 20 && s.size <= 160), fig.sec.map(s => s.size).join(','));
    }

  function check1(t){

    chk('буквы записи — концы сторон нужного угла', !!nm1 && nm1.ends.slice().sort().join('') === tgt.slice().sort().join(''));
    chk('угол меньше развёрнутого', angSize(fig, t.A) < 180);

          if(x.kind === 'neighbor') chk('«соседний»: ровно один общий луч с выделенным', p.ends.filter(c => tgt.includes(c)).length === 1);

          if(x.kind === 'wider') chk('«лишний сектор»: содержит выделенный угол', !!rel && angSectors(fig, rel).length > angSectors(fig, t.A).length && angSectors(fig, t.A).every(i => angSectors(fig, rel).includes(i)));

    if(!t.scale && t.ans === 'vert') chk('вертикальные: углы равны', a === b, a + ' vs ' + b);
    if(!t.scale && t.ans === 'none' && !t.nums) chk('«ни то ни другое»: нет общей стороны с продолжением и нет противоположных сторон', relation(fig, t.A, t.B) === 'none');

    if(t.kind === 'vals'){

      chk('числа в условии равны углам на чертеже', JSON.stringify(degNums(t.text)) === JSON.stringify(want), degNums(t.text) + ' vs ' + want);
      chk('ожидаемые числа = истинные углы чертежа', Object.keys(t.expected).every(i => t.expected[i] === fig.sec[i].size));
      chk('ожидаются только данные углы и вертикальные к ним', Object.keys(t.expected).length === new Set(t.givens.concat(t.givens.map(i => (i + half) % n))).size
        && t.givens.every(i => t.expected[i] !== undefined && t.expected[(i + half) % n] === t.expected[i]));
      chk('вертикальный к данному — действительно вертикальный (relation)', t.givens.every(i => relation(fig, angOfSector(fig, i), angOfSector(fig, (i + half) % n)) === 'vert'));
      chk('верно заполненный чертёж проходит проверку, пустой — нет', check3vals(t, Object.assign({}, t.expected)).length === 0 && check3vals(t, {}).length > 0);
      if(t.fig.nLines === 2 && t.givens.length === 1)       // один данный угол: то же число в смежном — ошибка «extra»
        chk('то же число в смежный угол распознаётся как ошибка', check3vals(t, Object.assign({}, t.expected, {[(t.givens[0] + 1) % n]:t.expected[t.givens[0]]})).some(x => x.kind === 'extra'));
    }else{
      const [i, j] = t.pair, A = angOfSector(fig, i), B = angOfSector(fig, j), a = sizeOfSec(fig, i), b = sizeOfSec(fig, j), nums = degNums(t.text);
      chk('пара из условия: relation() совпадает с заявленным соотношением', relation(fig, A, B) === t.rel, relation(fig, A, B) + ' vs ' + t.rel);
      if(t.type === 'm3.pair.vsum') chk('сумма из условия = сумма двух вертикальных углов', t.rel === 'vert' && a === b && nums[0] === a + b, nums[0] + ' vs ' + (a + b));
      else{
        const km = /в (\d+) раз/.exec(plainText(t.text));
        chk('смежные: сумма двух углов 180°', a + b === 180);
        if(km) chk('«в k раз больше» совпадает с чертежом', +km[1] * Math.min(a, b) === Math.max(a, b), km[1] + ': ' + a + ',' + b);
        else chk('«на d° больше» совпадает с чертежом', nums[0] === Math.abs(a - b), nums[0] + ' vs ' + Math.abs(a - b));
        chk('названный первым угол — больший', a > b);
      }
    }
    const fills = t.kind === 'pair' ? [angOfSector(fig, t.pair[0]), angOfSector(fig, t.pair[1])] : [];
    checkDrawing(fig, drawFigure(fig, {fills:fills.map(A => ({A, pat:'a'}))}), fills);
  }
  /* --- режимы 4 и 5 --- */
  function check45(t){
    const fig = t.fig, m = t.meta, z = i => fig.sec[i].size, nums = degNums(t.cond);
    chk('ответ задачи = размер искомого угла на чертеже', t.answer === z(t.target), t.answer + ' vs ' + z(t.target));
    chk('имена углов: вершина посередине', fig.sec.every((s, i) => s.size >= 180 || /^∠\d$/.test(t.C.plain(i)) || (parseName(fig, t.C.plain(i)) && parseName(fig, t.C.plain(i)).mid === 'O')));
    // разность d в задаче «на d° больше» — не угол, а разность двух углов (может быть и 10°), поэтому её не проверяем на диапазон углов
    if(t.kind !== 'diff') chk('числа в условии (углы и их суммы) лежат в пределах от 20° до 360°', nums.every(x => x >= 20 && x <= 360), nums.join(','));
    if(t.kind === 'sum2'){
      chk('сумма из условия = сумма двух вертикальных углов', relation(fig, angOfSector(fig, m.pair[0]), angOfSector(fig, m.pair[1])) === 'vert' && z(m.pair[0]) === z(m.pair[1]) && nums[0] === z(m.pair[0]) + z(m.pair[1]) && nums[0] === m.S);
      chk('искомый угол смежный с парой, ответ = 180° − угол', relation(fig, angOfSector(fig, m.base), angOfSector(fig, m.q)) === 'adj' && t.answer === 180 - z(m.pair[0]));
    }else if(t.kind === 'diff'){
      chk('смежные углы дают 180°', relation(fig, angOfSector(fig, m.big), angOfSector(fig, m.small)) === 'adj' && z(m.big) + z(m.small) === 180);
      chk('разность из условия = разность углов', nums[0] === m.d && m.d === z(m.big) - z(m.small), nums[0] + ' vs ' + (z(m.big) - z(m.small)));
    }else if(t.kind === 'ktimes'){
      chk('смежные углы дают 180°', relation(fig, angOfSector(fig, m.big), angOfSector(fig, m.small)) === 'adj' && z(m.big) + z(m.small) === 180);
      const km = /в (\d+) раз/.exec(plainText(t.cond));
      chk('«в k раз больше» совпадает с чертежом', !!km && +km[1] === m.k && m.k * z(m.small) === z(m.big), km && km[1] + ': ' + z(m.small) + ',' + z(m.big));
    }else if(t.kind === 'sum3'){
      const s3 = m.three.reduce((a, i) => a + z(i), 0);
      chk('сумма трёх углов из условия + четвёртый = 360° (полный круг)', nums[0] === m.S && s3 === m.S && m.S + z(m.w) === 360, nums[0] + ',' + s3 + ',' + z(m.w));
      chk('искомый угол — один из трёх названных', m.three.includes(m.t));
    }else if(t.kind === 'three'){
      const tri = [m.g1, m.mid, m.tg].reduce((a, i) => a + z(i), 0), s0 = m.s0;
      chk('три угла подряд лежат между противоположными лучами и дают 180°', tri === 180 && fig.rays[(s0 + 3) % 6].ang === mod360(fig.rays[s0].ang + 180), tri);
      chk('условие содержит ровно данные ∠ (a и b), второй вертикален к среднему', JSON.stringify(nums) === JSON.stringify([m.a, m.b]) && relation(fig, angOfSector(fig, m.g2), angOfSector(fig, m.mid)) === 'vert' && z(m.g2) === z(m.mid) && z(m.mid) === m.b);
      chk('ответ = 180° − a − b', t.answer === 180 - m.a - m.b);
    }
    t.steps.forEach(step => {
      let lastRel = null;
      step.qs.forEach(q => {
        if(q.id === 'rel'){ lastRel = q.ans; chk('шаг «какие это углы»: ответ — смежные или вертикальные', q.ans === 'adj' || q.ans === 'vert'); }
        if(q.id === 'rule' && lastRel) chk('правило согласовано с видом углов (вертикальные ⇒ равны, смежные ⇒ 180°)', (lastRel === 'vert' && q.ans === 'eq') || (lastRel === 'adj' && q.ans === 'sum180'));
        if(q.kind === 'choice') chk('для каждого неверного варианта есть подсказка', q.opts.filter(o => o.id !== q.ans).every(o => { const h = q.hint(o.id); return h && h.html && String(h.html).length > 3; }));
        if(q.kind === 'num'){
          chk('числа шага равны углам на чертеже', q.place.every(p => p.v === z(p.sec)), JSON.stringify(q.place) + ' ' + q.ans);
          if(q.place.length) chk('ответ шага = значение этих углов', q.place[0].v === q.ans);
          if(!q.place.length) chk('ответ шага без угла: сумма смежных = 180°', q.ans === 180);
          chk('ответ — целое число градусов', Number.isInteger(q.ans) && q.ans > 0 && q.ans <= 360);
        }
      });
    });
    const known = {}; (t.known0 || []).forEach(k => known[k.sec] = k.v);
    chk('известные с начала числа равны углам чертежа', Object.keys(known).every(i => known[i] === z(i)));
    checkDrawing(fig, problemSvg(t), t.steps[0].angles.map(a => a.A));
  }
  const problemSvg = t => drawFigure(t.fig, {fills:t.steps[0].angles});

  const per = Math.floor(N / 5), counts = {};
  const runs = [[1, gen1, check1], [2, gen2, check2], [3, gen3, check3], [4, gen4, check45], [5, gen5, check45]];
  try{
    runs.forEach(([mode, gen, check]) => {
      for(let i = 0; i < per; i++){
        ctx = `режим ${mode}`;
        let t; try{ t = gen(); }catch(e){ chk('генератор не падает', false, e.message); continue; }
        ctx = `режим ${mode}, ${t.type}`;
        counts[mode] = (counts[mode] || 0) + 1; R.total++; R.tasks[t.type] = (R.tasks[t.type] || 0) + 1;
        checkFigure(t.fig);
        try{ check(t); }catch(e){ chk('проверка задачи не падает', false, e.message); }
      }
    });
  }finally{ _rng = prev; }
  R.counts = counts;
  R.checkCount = Object.keys(R.checks).reduce((a, k) => a + R.checks[k].ok + R.checks[k].bad, 0);
  R.bad = Object.keys(R.checks).reduce((a, k) => a + R.checks[k].bad, 0);
  return R;
}
function formatCheck(R){
  const L = [];
  L.push('САМОПРОВЕРКА МАТЕМАТИКИ: ' + (R.topic === 'tri' ? 'ТРЕУГОЛЬНИКИ' : 'СМЕЖНЫЕ И ВЕРТИКАЛЬНЫЕ УГЛЫ'));
  L.push(`Сгенерировано задач: ${R.total} (по режимам: ${Object.keys(R.counts).map(m => m + ':' + R.counts[m]).join(', ')}), зерно ${R.seed}`);
  L.push(`Выполнено проверок: ${R.checkCount}, расхождений: ${R.bad}`);
  L.push('');
  Object.keys(R.checks).forEach(k => { const c = R.checks[k]; L.push(`${c.bad ? '[!!]' : '[ok]'} ${k}: ${c.ok + c.bad}${c.bad ? ', ошибок ' + c.bad : ''}`); });
  if(R.fails.length){ L.push(''); L.push('Первые расхождения:'); R.fails.forEach(f => L.push(' • ' + f)); }
  L.push('');
  L.push(R.bad === 0 ? 'ИТОГ: всё согласовано' : 'ИТОГ: НАЙДЕНЫ РАСХОЖДЕНИЯ');
  return L.join('\n');
}

/* ---------- 8.1 пиксельные текстуры: рисуем сами, 16×16, случайные оттенки ---------- */
const TEX = {};
const canv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rgbc = (c, d) => `rgb(${clamp(c[0] + d, 0, 255)},${clamp(c[1] + d, 0, 255)},${clamp(c[2] + d, 0, 255)})`;
const ORE_COL = {coal:[26, 26, 30], iron:[224, 180, 152], gold:[252, 218, 64], diamond:[96, 238, 238]};
function paintTile(x, ox, oy, kind, r){
  const shift = (r() - .5) * 14, fringe = [];
  for(let i = 0; i < 16; i++) fringe.push(3 + Math.floor(r() * 3));
  const stoneLike = kind === 'stone' || kind === 'deep' || kind.indexOf('ore:') === 0;
  for(let py = 0; py < 16; py++) for(let px = 0; px < 16; px++){
    let col = [128, 128, 128], d = Math.floor((r() - .5) * 22 + shift);
    if(kind === 'grassSide') col = py < fringe[px] ? [92, 168, 52] : [134, 96, 67];
    else if(kind === 'dirt') col = [134, 96, 67];
    else if(kind === 'deep') col = [72, 72, 82];
    if(kind === 'dirt' && r() < .06) d -= 28;
    if(stoneLike && r() < .07) d -= 24;
    x.fillStyle = rgbc(col, d); x.fillRect(ox + px, oy + py, 1, 1);
  }
  if(kind.indexOf('ore:') === 0){
    const oc = ORE_COL[kind.slice(4)];
    for(let k = 0; k < 6; k++){
      const cx = 2 + Math.floor(r() * 11), cy = 2 + Math.floor(r() * 11);
      [[0, 0], [1, 0], [0, 1], [1, 1]].forEach((o, j) => { if(j < 2 || r() < .6){ x.fillStyle = rgbc(oc, Math.floor((r() - .5) * 20)); x.fillRect(ox + cx + o[0], oy + cy + o[1], 1, 1); } });
    }
  }
}
function gemCanvas(){
  const c = canv(16, 16), x = c.getContext('2d');
  const inside = (px, py) => {
    if(py >= 3 && py <= 6){ const hw = 4 + (py - 3); return Math.abs(px - 7.5) <= hw; }
    if(py >= 7 && py <= 13){ const hw = 7.2 - (py - 7) * 1.12; return Math.abs(px - 7.5) <= hw; }
    return false;
  };
  for(let py = 0; py < 16; py++) for(let px = 0; px < 16; px++){
    if(!inside(px, py)) continue;
    const edge = !inside(px - 1, py) || !inside(px + 1, py) || !inside(px, py - 1) || !inside(px, py + 1);
    let col = '#4bd6e6';
    if(edge) col = '#0b5d6b';
    else if(py <= 4) col = '#d5fcff';
    else if(Math.abs(px - 7.5) < 1.6) col = '#9cf0f8';
    else if(px < 7.5) col = '#2bb4c9';
    else col = '#66e0ee';
    x.fillStyle = col; x.fillRect(px, py, 1, 1);
  }
  return c;
}
function bmpCanvas(rows, color){
  const c = canv(rows[0].length, rows.length), x = c.getContext('2d');
  rows.forEach((row, y) => { for(let i = 0; i < row.length; i++) if(row[i] !== '.'){ x.fillStyle = row[i] === '#' ? color : row[i] === 'y' ? '#ffd23f' : color; x.fillRect(i, y, 1, 1); } });
  return c;
}

function buildTextures(){

  TEX.sunBig = url(sun);

  mx.fillStyle = '#b3b3c8'; [[2, 2], [5, 3], [3, 5], [5, 5]].forEach(p => mx.fillRect(p[0], p[1], 1, 1));
  TEX.moonBig = url(moon);
  // маленькие значки интерфейса
  Object.keys(BMP).forEach(k => { TEX[k] = url(bmpCanvas(BMP[k], '#161616')); });
  const mc = canv(13, 13), mcx = mc.getContext('2d');
  for(let y = 0; y < 13; y++) for(let x = 0; x < 13; x++){
    const a = Math.hypot(x - 6, y - 6) <= 5.6, b = Math.hypot(x - 9.2, y - 4.6) <= 4.6;
    if(a && !b){ mcx.fillStyle = '#161616'; mcx.fillRect(x, y, 1, 1); }
  }
  TEX.moon = url(mc);
  TEX.lockL = TEX.lock; TEX.checkG = url(bmpCanvas(BMP.check, '#1f7a12'));
  // применить
  const root = document.documentElement.style;
  $('#ground').style.backgroundImage = `url(${TEX.ground})`;
  $('#deep').style.backgroundImage = `url(${TEX.deepbg})`;
  $('#stars').style.backgroundImage = `url(${TEX.stars})`;
  [0, 1, 2].forEach(i => { $('#cl' + (i + 1)).src = TEX['cloud' + i]; });
  $('#bTeacher').firstElementChild.src = TEX.book;
}

/* ---------- 8.2 звуки (8-битные, Web Audio, по умолчанию выключены) ---------- */
const Sfx = {ctx:null};
function audioCtx(){
  try{
    if(!Sfx.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; Sfx.ctx = new C(); }
    if(Sfx.ctx.state === 'suspended') Sfx.ctx.resume();
    return Sfx.ctx;
  }catch(e){ return null; }
}
const SFX = {
  ok:[[660, .08], [880, .14]],
  bad:[[196, .12, 'triangle', .1], [147, .2, 'triangle', .1]],
  mine:[[523, .08], [659, .08], [784, .08], [1047, .22]],
  win:[[523, .1], [659, .1], [784, .1], [659, .1], [1047, .3]],
  click:[[440, .04, 'square', .04]]
};
function playSfx(name){
  if(!S.sound) return;
  const c = audioCtx(); if(!c || !SFX[name]) return;
  let t = c.currentTime + .01;
  SFX[name].forEach(n => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = n[2] || 'square'; o.frequency.setValueAtTime(n[0], t);
    g.gain.setValueAtTime(n[3] || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + n[1]);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + n[1] + .03); t += n[1] * .92;
  });
}

const Run = {mode:0, task:null, errs:0, shown:false, done:false,
  begin(mode, task){ this.mode = mode; this.task = task; this.errs = 0; this.shown = false; this.done = false; },
  finish(){
    if(this.done) return null; this.done = true;
    const outcome = this.shown ? 'shown' : this.errs ? 'hint' : 'self';
    const res = recordTask(this.mode, this.task.type, outcome, this.errs);
    res.outcome = outcome;
    updateXp(); renderHotbar(res.mined ? (S.mined - 1) % 9 : -1);
    if(res.mined){
      const ore = oreOfSlot((S.mined - 1) % 9);
      toast(`<img src="${TEX[ore]}" alt=""><span>ДОБЫТ БЛОК:<br>${ORE_NAMES[ore]}</span>`, 3200); playSfx('mine');

function flash(ok){

}
/* Общее правило обратной связи: 1-я ошибка → подсказка на шаг, 2-я → разбор с подсветкой на чертеже.
   gate — счётчик попыток для одного вопроса. Возвращает 'right' | 'hint' | 'shown'. */
function judge(gate, ok, o){
  if(ok){ flash(true); return 'right'; }
  gate.tries = (gate.tries || 0) + 1; Run.errs++; noteTrap(o.trap); flash(false);
  if(gate.tries === 1){ setFb(o.hint, 'hint'); if(o.onHint) o.onHint(); return 'hint'; }
  Run.shown = true; setFb(o.reveal, 'show'); if(o.onReveal) o.onReveal(); return 'shown';
}

/* ---------- общие подписи на чертеже для режимов 3–5 ---------- */
function sectorLabels(fig, o){
  const L = [];
  fig.sec.forEach((s, i) => {
    if(s.size >= 180) return;
    const mid = s.a0 + s.size / 2, v = o.values ? o.values[i] : undefined;
    if(o.num) L.push({deg:mid, r:numR(s.size), text:String(o.num[i]), cls:'tag-n'});
    if(v !== undefined) L.push({deg:mid, r:valR(s.size), text:v + '°', box:[v >= 100 ? 52 : 44, 26], fill:(o.cell && o.cell[i]) || '#fffbe8'});
    else if(o.q && o.q.includes(i)) L.push({deg:mid, r:valR(s.size), text:'?', cls:'val q', box:[34, 26], fill:'#fff0b8'});
    else if(o.empty && o.empty.includes(i)) L.push({deg:mid, r:valR(s.size), text:'', box:[46, 26], fill:'#ffffff'});
  });
  return L;
}
const arcsAll = fig => fig.sec.filter(s => s.size < 180).map(s => ({A:angOfSector(fig, s.i), r:29, color:'#444'}));
const numInput = (id, label, unit) => `<div class="field">${label || ''}<input id="${id}" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" step="1" autocomplete="off" aria-label="Ответ"><span class="u">${esc(unit || '°')}</span></div>`;

function mount3vals(t, stage){
  const fig = t.fig, gate = {};
  let placed = {}, armed = null, sel = null, hover = -1, locked = false;
  stage.innerHTML = `<p class="task">Перенеси условие на чертёж: впиши числа в нужные углы.</p>
    <p class="lead">Считать ничего не нужно: пойми, какому углу принадлежит число и какие ещё углы ему равны.</p>
    <div class="inset"><span class="px" style="font-size:10px">УСЛОВИЕ</span><div class="task" style="margin:6px 0 0">${t.text}</div></div>
    <div id="boardHost"></div>
    <div class="steplab">ФИШКИ: НАЖМИ НА ФИШКУ И НА УГОЛ ИЛИ ПЕРЕТАЩИ</div><div class="tray" id="tray"></div>
    <div id="manual"></div>
    <div class="row" style="margin:12px 3px 0"><button class="btn big grow" id="bCheck" type="button">ПРОВЕРИТЬ</button><button class="btn" id="bClear" type="button">ОЧИСТИТЬ</button></div>
    <div id="fb"></div><div id="nextbar"></div>`;
  const host = $('#boardHost');
  const paint = o => {
    o = o || {};
    const fills = [];
    if(sel !== null) fills.push({A:angOfSector(fig, sel), pat:'sel'});
    if(hover >= 0 && hover !== sel) fills.push({A:angOfSector(fig, hover), pat:'sel'});
    (o.fills || []).forEach(f => fills.push(f));
    const empty = fig.sec.map((s, i) => i).filter(i => placed[i] === undefined);
    host.innerHTML = boardHTML(drawFigure(fig, {attrs:locked ? '' : 'class="tap"', fills, rayEm:o.rayEm, arcs:t.num ? arcsAll(fig) : [],
      labels:sectorLabels(fig, {num:t.num, values:placed, empty, cell:o.cell})}));
    if(!locked) $('svg', host).addEventListener('click', onBoard);
  };
  const sectorFromClient = ev => {
    const svg = $('svg', host), r = svg.getBoundingClientRect();
    if(ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return -1;
    return sectorAtPoint(fig, (ev.clientX - r.left) * 360 / r.width, (ev.clientY - r.top) * 360 / r.height);
  };
  const renderTray = () => {
    $('#tray').innerHTML = t.chips.map(v => `<button class="chip${armed === v ? ' arm' : ''}" data-v="${v}" type="button" aria-pressed="${armed === v}">${v}°</button>`).join('');
    $$('#tray .chip').forEach(ch => {
      const v = +ch.dataset.v;
      ch.addEventListener('click', ev => { if(ev.detail === 0 && !locked){ armed = armed === v ? null : v; renderTray(); } });   // с клавиатуры
      ch.addEventListener('pointerdown', e => {
        if(locked) return;
        e.preventDefault();
        let moved = false, ghost = null; const x0 = e.clientX, y0 = e.clientY;
        const move = ev => {
          if(!moved && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8){ moved = true; ghost = ch.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); }
          if(moved){ ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; const i = sectorFromClient(ev); if(i !== hover){ hover = i; paint(); } }
        };
        const up = ev => {
          document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
          if(ghost) ghost.remove();
          if(moved){ const i = sectorFromClient(ev); hover = -1; if(i >= 0) put(i, v); else paint(); }
          else { armed = armed === v ? null : v; renderTray(); }
        };
        document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
      });
    });
  };
  const showManual = () => {
    const m = $('#manual');
    if(sel === null){ m.innerHTML = ''; return; }
    m.innerHTML = `<div class="qtext">Угол ${t.nmH[sel]} — впиши число:</div>
      <div class="field"><input id="mval" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" autocomplete="off" aria-label="Число для выбранного угла"><span class="u">°</span>
      <button class="btn" id="bPut" type="button">ВПИСАТЬ</button><button class="btn" id="bErase" type="button">СТЕРЕТЬ</button></div>`;
    const inp = $('#mval'); if(placed[sel] !== undefined) inp.value = placed[sel];
    const doPut = () => { const v = parseInt(inp.value, 10); if(!isNaN(v) && v > 0 && v < 361){ placed[sel] = v; sel = null; paint(); showManual(); } };
    $('#bPut').addEventListener('click', doPut);
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') doPut(); });
    $('#bErase').addEventListener('click', () => { delete placed[sel]; sel = null; paint(); showManual(); });
  };
  function put(i, v){ placed[i] = v; sel = null; hover = -1; paint(); showManual(); }
  function onBoard(e){
    if(locked) return;
    const xy = svgXY(e.currentTarget, e), i = sectorAtPoint(fig, xy[0], xy[1]);
    if(i < 0) return;
    if(armed !== null) put(i, armed);
    else { sel = sel === i ? null : i; paint(); showManual(); }
  }
  renderTray(); paint();

  const hint3 = iss => {
    const i = iss.i, nmI = t.nmH[i], A = angOfSector(fig, i), rays = [A.from, A.to];
    if(iss.kind === 'wrongPlace') return {trap:'wrongPlace', html:`<p>В угол ${nmI} поставлено ${iss.got}°, но по условию там другое число.</p><p>Проверь, какому углу относится каждое число: ${whereIs(t, i)}.</p>`, fills:[{A, pat:'bad'}], rays};
    if(iss.kind === 'extra'){
      // нашли «источник» этого числа; смежность проверяем по лучам, а не по соседству номеров
      const nb = Object.keys(t.expected).map(Number).find(j => t.expected[j] === iss.got && relation(fig, A, angOfSector(fig, j)) === 'adj');
      return nb !== undefined
        ? {trap:'eqAdj', html:`<p>${nmI} — смежный с ${t.nmH[nb]}: смежные углы не равны, вместе они дают 180°.</p><p>Считать мы пока не будем — оставь этот угол пустым.</p>`, fills:[{A, pat:'bad'}, {A:angOfSector(fig, nb), pat:'a'}], rays}
        : {trap:'extraNum', html:`<p>Для угла ${nmI} числа в условии нет, и равным известному он не является.</p><p>Оставь его пустым: считать мы пока не будем.</p>`, fills:[{A, pat:'bad'}], rays};
    }
    if(iss.kind === 'missGiven') return {trap:'missGiven', html:`<p>Не все числа из условия перенесены на чертёж.</p><p>Проверь: по условию ${nmI} = ${t.expected[i]}°. Где этот угол? ${whereIs(t, i)}.</p>`, fills:[{A, pat:'a'}], rays};
    const g = (i + t.half) % fig.n;           // skipVert: угол напротив уже известного
    return {trap:'skipVert', html:`<p>Есть ещё угол, значение которого уже известно, считать не нужно.</p><p>Посмотри на угол, который лежит «напротив» ${t.nmH[g]}: вертикальные углы равны.</p>`, fills:[{A:angOfSector(fig, g), pat:'a'}, {A, pat:'b'}], rays:[]};
  };
  const reveal3 = () => {
    const lines = t.givens.map(g => `<li>${t.nmH[g]} = ${t.expected[g]}° — по условию.</li><li>${t.nmH[(g + t.half) % fig.n]} вертикальный к ${t.nmH[g]}, поэтому тоже ${t.expected[g]}°.</li>`).join('');
    return `<p>Вот как надо:</p><ul style="margin:0;padding-left:20px">${lines}</ul><p>Остальные углы смежные с известными: их значения придётся считать, сейчас они остаются пустыми.</p>`;
  };
  $('#bClear').addEventListener('click', () => { if(locked) return; placed = {}; sel = null; armed = null; renderTray(); paint(); showManual(); });
  $('#bCheck').addEventListener('click', () => {
    if(locked) return;
    const issues = check3vals(t, placed), first = issues[0];
    if(!first && Object.keys(placed).length === 0) { setFb('<p>Сначала впиши числа из условия в углы на чертеже.</p>', 'hint'); return; }
    const hint = first ? hint3(first) : null;
    const r = judge(gate, !first, {trap:hint && hint.trap, hint:hint && hint.html, reveal:reveal3()});
    if(r === 'right'){ locked = true; sel = null; armed = null; renderTray(); paint({cell:Object.fromEntries(Object.keys(placed).map(k => [k, '#c8f5b0']))}); $('#manual').innerHTML = ''; finishTask('Всё верно: числа из условия стоят в своих углах, и вертикальные углы подписаны равными.'); }
    else if(r === 'hint'){ paint({fills:hint.fills, rayEm:hint.rays}); }
    else{ locked = true; sel = null; armed = null; renderTray(); placed = Object.assign({}, t.expected); paint({cell:Object.fromEntries(Object.keys(placed).map(k => [k, '#c8f5b0'])), fills:t.givens.map(g => ({A:angOfSector(fig, g), pat:'ok'}))}); $('#manual').innerHTML = ''; finishTask(null); }
  });
}

function mount3pair(t, stage){
  const fig = t.fig, g1 = {}, g2 = {}, need = t.pair;
  let sel = [], phase = 1, locked = false;
  const [i, j] = need, A = angOfSector(fig, i), B = angOfSector(fig, j);
  const probe = {fig, A, B, nA:t.nmP[i], nB:t.nmP[j], nums:null, ans:t.rel, kind:t.rel};
  stage.innerHTML = `<p class="task">Перенеси условие на чертёж: найди углы из условия.</p>
    <div class="inset"><span class="px" style="font-size:10px">УСЛОВИЕ</span><div class="task" style="margin:6px 0 0">${t.text}</div></div>
    <p class="lead" id="q1">Нажми на оба угла, о которых говорится в условии, затем на «ПРОВЕРИТЬ».</p>
    <div id="boardHost"></div><div id="q2"></div>
    <div class="row" style="margin:12px 3px 0" id="chkRow"><button class="btn big grow" id="bCheck" type="button">ПРОВЕРИТЬ</button></div>
    <div id="fb"></div><div id="nextbar"></div>`;
  const host = $('#boardHost');
  const paint = o => {
    o = o || {};
    const fills = phase === 1 ? sel.map(k => ({A:angOfSector(fig, k), pat:'sel'})) : [{A, pat:o.pat1 || 'a'}, {A:B, pat:o.pat2 || 'b'}];
    host.innerHTML = boardHTML(drawFigure(fig, {attrs:phase === 1 && !locked ? 'class="tap"' : '', fills, rayEm:o.rayEm, arcs:t.num ? arcsAll(fig) : [], labels:sectorLabels(fig, {num:t.num})}));
    if(phase === 1 && !locked) $('svg', host).addEventListener('click', e => {
      const xy = svgXY(e.currentTarget, e), k = sectorAtPoint(fig, xy[0], xy[1]);
      if(k < 0) return;
      sel = sel.includes(k) ? sel.filter(x => x !== k) : sel.concat([k]); paint();
    });
  };
  paint();
  const bothRays = [A.from, A.to, B.from, B.to];
  $('#bCheck').addEventListener('click', () => {
    if(locked || phase !== 1) return;
    const ok = sel.length === 2 && need.every(k => sel.includes(k));
    const names = `${t.nmH[i]} и ${t.nmH[j]}`;
    const hint = sel.length !== 2 ? `<p>В условии названы два угла: ${names}. Выбери оба.</p>`
      : `<p>Прочитай условие ещё раз: там названы ${names}. Найди именно их: ${t.naming === 'num' ? `на чертеже это дуги с цифрами ${t.num[i]} и ${t.num[j]}` : `они лежат между лучами ${rayNames(t, i)} и ${rayNames(t, j)}`}.</p>`;
    const r = judge(g1, ok, {trap:'pickWrong', hint, reveal:`<p>В условии названы ${names} — вот они на чертеже.</p>`});
    if(r === 'hint') paint({rayEm:t.naming === 'let' ? bothRays : []});
    else{ phase = 2; sel = []; if(r === 'shown') locked = false; paint(); startPhase2(r === 'shown'); }
  });
  function startPhase2(wasShown){
    $('#chkRow').innerHTML = '';
    $('#q1').innerHTML = `Что можно сказать про ${t.nmH[i]} и ${t.nmH[j]}?`;
    if(!wasShown) setFb('<p>Углы найдены верно.</p>', 'ok');
    $('#q2').innerHTML = `<div class="opts"><button class="btn block" data-a="vert" type="button">РАВНЫ: ЭТО ВЕРТИКАЛЬНЫЕ УГЛЫ</button><button class="btn block" data-a="adj" type="button">ВМЕСТЕ 180°: ЭТО СМЕЖНЫЕ УГЛЫ</button><button class="btn block" data-a="none" type="button">СВЯЗИ НЕТ: НЕ СМЕЖНЫЕ И НЕ ВЕРТИКАЛЬНЫЕ</button></div>`;
    $$('#q2 .btn').forEach(b => b.addEventListener('click', () => {
      if(locked) return;
      const a = b.dataset.a, h = hint2(probe, a), btns = $$('#q2 .btn');
      const r = judge(g2, a === t.rel, {trap:'relPick', hint:`<p>${h.html}</p>`, reveal:`<p>${why2(probe)}</p>`});
      if(r === 'right'){ locked = true; b.classList.add('good'); btns.forEach(x => x.disabled = true); paint(); finishTask(whyShort2(probe)); }
      else if(r === 'hint'){ b.classList.add('bad'); b.disabled = true; paint({rayEm:h.rays}); }
      else{ locked = true; b.classList.add('bad'); btns.forEach(x => { x.disabled = true; if(x.dataset.a === t.rel) x.classList.add('good'); }); paint({rayEm:bothRays}); finishTask(null); }
    }));
  }
}

/* ---------- 12. режимы 4 и 5: решение по шагам / «как в учебнике» ---------- */
GENS[4] = gen4;
GENS[5] = gen5;
MOUNTS[4] = (t, stage) => mountSteps(t, stage, {});
MOUNTS[5] = (t, stage) => mount5(t, stage);

const taskBox = t => `<div class="inset"><span class="px" style="font-size:10px">ЗАДАЧА</span><div class="task" style="margin:6px 0 0">${t.text}</div>${t.banner ? `<div class="badge">${t.banner}</div>` : ''}</div>`;
const ansName = t => t.tName || t.C.html(t.target);              // как назвать искомую величину
const ansUnit = t => t.unit || '°';
function problemBoard(t, known, o){
  if(t.paint) return t.paint(known, o || {});                     // треугольники рисуют свой чертёж сами
  o = o || {};
  const fig = t.fig;
  return boardHTML(drawFigure(fig, {fills:o.fills || [], rayEm:o.rayEm, arcs:t.num ? arcsAll(fig) : [],
    labels:sectorLabels(fig, {num:t.num, values:known, q:known[t.target] === undefined ? [t.target] : []})}));
}
const knownStart = t => { const k = {}; (t.known0 || []).forEach(x => k[x.sec] = x.v); return k; };

/* Решение по шагам: «Какие это углы?» → «Какое правило?» → «Чему равен угол?» */
function mountSteps(t, stage, o){
  const known = knownStart(t);
  let si = 0, qi = 0, gate = {}, rayEm = [], locked = false;
  stage.innerHTML = `${o.note ? `<div class="fb show"><span class="tag">РАЗБОР</span>${o.note}</div>` : ''}${taskBox(t)}
    <div id="boardHost"></div><div class="steplab" id="stepLab"></div><div class="qtext" id="qText"></div><div id="qAns"></div>
    <div id="fb"></div><ul class="log" id="log"></ul><div id="nextbar"></div>`;
  const host = $('#boardHost');
  const paint = fills => { host.innerHTML = problemBoard(t, known, {fills:fills || (t.steps[si] ? t.steps[si].angles : []), rayEm}); };
  const addLog = (html, shown) => { $('#log').insertAdjacentHTML('beforeend', `<li class="${shown ? 'w' : ''}">${html}</li>`); };
  const place = q => q.place.forEach(p => { known[p.sec] = p.v; });
  function next(){
    qi++;
    if(qi >= t.steps[si].qs.length){ si++; qi = 0; }
    if(si >= t.steps.length) return complete();
    showQ();
  }
  function complete(){
    locked = true; rayEm = []; paint([]);
    $('#stepLab').textContent = ''; $('#qText').innerHTML = ''; $('#qAns').innerHTML = '';
    finishTask(`Ответ: ${ansName(t)} = ${t.answer}${ansUnit(t)}.`);
  }
  function afterQuestion(q, how){
    addLog(how === 'shown' ? `Разбор: ${q.full}` : q.short, how === 'shown');
    if(q.kind === 'num') place(q);
    if(how === 'right'){ next(); return; }
    paint(); $('#qAns').insertAdjacentHTML('beforeend', `<div class="row" style="margin:12px 3px 0"><button class="btn big grow" id="bGo" type="button">ПОНЯТНО, ДАЛЬШЕ</button></div>`);
    $('#bGo').addEventListener('click', () => { playSfx('click'); setFb(''); next(); });
    $('#bGo').focus({preventScroll:true});
  }
  function showQ(){
    const q = t.steps[si].qs[qi]; gate = {}; rayEm = []; locked = false; setFb(''); paint();
    $('#stepLab').textContent = `ШАГ ${si + 1} ИЗ ${t.steps.length}`;
    $('#qText').innerHTML = q.ask;
    if(q.kind === 'choice'){
      $('#qAns').innerHTML = `<div class="opts">${q.opts.map(x => `<button class="btn block" data-id="${x.id}" type="button">${esc(x.label)}</button>`).join('')}</div>`;
      $$('#qAns .btn').forEach(b => b.addEventListener('click', () => {
        if(locked) return;
        const id = b.dataset.id, h = q.hint(id), btns = $$('#qAns .btn');
        const r = judge(gate, id === q.ans, {trap:h.trap, hint:`<p>${h.html}</p>`, reveal:`<p>${q.full}</p>`});
        if(r === 'right'){ locked = true; b.classList.add('good'); btns.forEach(x => x.disabled = true); afterQuestion(q, 'right'); }
        else if(r === 'hint'){ b.classList.add('bad'); b.disabled = true; rayEm = h.rays || []; paint(); }
        else{ locked = true; b.classList.add('bad'); btns.forEach(x => { x.disabled = true; if(x.dataset.id === q.ans) x.classList.add('good'); }); rayEm = h.rays || []; afterQuestion(q, 'shown'); }
      }));
    }else{
      $('#qAns').innerHTML = `<div class="field"><input id="num" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" step="1" autocomplete="off" aria-label="Ответ"><span class="u">${esc(ansUnit(t))}</span><button class="btn big" id="bOk" type="button">ОТВЕТИТЬ</button></div>`;
      const inp = $('#num'), send = () => {
        if(locked) return;
        const v = parseInt(inp.value, 10);
        if(isNaN(v)){ setFb('<p>Впиши число — например, 65.</p>', 'hint'); return; }
        const w = q.wrongs.find(x => x.v === v);
        const r = judge(gate, v === q.ans, {trap:'numWrong', hint:`${w ? `<p>${w.msg}</p>` : ''}<p>${q.hint}</p>`, reveal:`<p>${q.full}</p>`});
        if(r === 'right'){ locked = true; inp.disabled = true; $('#bOk').disabled = true; afterQuestion(q, 'right'); }
        else if(r === 'hint'){ inp.select(); }
        else{ locked = true; inp.disabled = true; $('#bOk').disabled = true; afterQuestion(q, 'shown'); }
      };
      $('#bOk').addEventListener('click', send);
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
      if(!o.noFocus) inp.focus({preventScroll:true});
    }
  }
  showQ();
}

/* «Как в учебнике»: задача целиком, только ответ. Ошибка → подсказка, вторая ошибка → разбивка на шаги режима 4. */
function mount5(t, stage){
  const gate = {}, known = knownStart(t);
  let locked = false;
  stage.innerHTML = `${taskBox(t)}<div id="boardHost">${problemBoard(t, known)}</div>
    ${numInput('ans', `<span class="px" style="font-size:10px;align-self:center">ОТВЕТ</span>`, ansUnit(t))}
    <div class="row" style="margin:0 3px"><button class="btn big grow" id="bOk" type="button">ПРОВЕРИТЬ</button></div>
    <div id="fb"></div><div id="more"></div><div id="nextbar"></div>`;
  const inp = $('#ans');
  const toSteps = note => { locked = true; Run.shown = true; mountSteps(t, stage, {note, noFocus:false}); stage.scrollIntoView({block:'start', behavior:'smooth'}); };
  const send = () => {
    if(locked) return;
    const v = parseInt(inp.value, 10);
    if(isNaN(v)){ setFb('<p>Впиши число — например, 65.</p>', 'hint'); return; }
    const w = t.wrongs.find(x => x.v === v);
    const r = judge(gate, v === t.answer, {trap:'numWrong', hint:`${w ? `<p>${w.msg}</p>` : ''}<p>${t.hint5}</p>`, reveal:'<p>Давай разберём эту задачу по шагам.</p>'});
    if(r === 'right'){ locked = true; inp.disabled = true; $('#bOk').disabled = true; $('#more').innerHTML = ''; finishTask(`${ansName(t)} = ${t.answer}${ansUnit(t)}. ${t.steps[t.steps.length - 1].qs.slice(-1)[0].short}`); }
    else if(r === 'hint'){
      inp.select();
      $('#more').innerHTML = `<div class="row" style="margin:12px 3px 0"><button class="btn grow" id="bSteps" type="button">РАЗБИТЬ НА ШАГИ</button></div>`;
      $('#bSteps').addEventListener('click', () => toSteps('<p>Решим эту же задачу по шагам: на каждом шаге один вопрос.</p>'));
    }else toSteps('<p>Решим эту же задачу по шагам: на каждом шаге один вопрос.</p>');
  };
  $('#bOk').addEventListener('click', send);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
  inp.focus({preventScroll:true});
}

/* ---------- 13. страница «Для учителя» ---------- */
function storageOK(){
  try{ const k = LS_KEY + '-t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
function renderTeacher(){
  App.screen = 'teacher';
  const sum = m => S.modes[m].self + S.modes[m].hint + S.modes[m].shown;
  let h = `<section class="win"><div class="row between"><h1 style="margin:0">ДЛЯ УЧИТЕЛЯ</h1><button class="btn" id="tBack" type="button">МЕНЮ</button></div>
    <p class="lead" style="margin-top:12px">Статистика ученика на этом устройстве. «Сам» — верно с первой попытки; «с подсказкой» — верно после подсказки; «показано» — пришлось показать решение.</p>
    ${storageOK() ? '' : '<div class="fb hint"><span class="tag">ВНИМАНИЕ</span><p>Браузер не даёт сохранять данные (приватный режим или запрет). Тренажёр работает, но прогресс исчезнет при закрытии страницы.</p></div>'}</section>`;
  TOPICS.forEach(tp => {
